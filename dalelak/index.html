<style>
:root{
  --ink:#08202F; --deep:#0F3348; --sea:#2A8AA6;
  --brass:#D19A38; --brass-soft:#EBC57C;
  --text:#E9F2F6; --muted:#A9C6D4; --line:rgba(235,197,124,.24);
  --card:rgba(8,32,47,.72);
  --f-body:"Tajawal",system-ui,sans-serif;
  --f-head:"Noto Kufi Arabic","Tajawal",sans-serif;
}
html[lang="en"]{--f-body:"Manrope",system-ui,sans-serif;--f-head:"Sora","Manrope",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);color:var(--text);background:var(--ink);font-size:17px;line-height:1.7;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  overscroll-behavior-y:none;-webkit-tap-highlight-color:rgba(235,197,124,.2)}
h1,h2,h3,.kufi{font-family:var(--f-head);line-height:1.35}
html[lang="en"] body{line-height:1.65}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:6px}

.backdrop{position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:radial-gradient(120% 90% at 80% 0%, #164459 0%, #0B2C3F 45%, #08202F 100%)}
.backdrop .sky{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.backdrop::after{content:"";position:absolute;inset:0;
  background:linear-gradient(to bottom, rgba(8,32,47,.35) 0%, rgba(8,32,47,.72) 55%, rgba(8,32,47,.92) 100%)}
.skyline{position:fixed;left:0;right:0;bottom:0;width:100%;z-index:-1;pointer-events:none;opacity:.85}

header{position:sticky;top:0;z-index:30;background:rgba(6,25,37,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1140px;margin-inline:auto;padding-inline:20px}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand svg{width:34px;height:34px;flex:none}
.bw{font-family:var(--f-head);font-size:22px;font-weight:900;display:block;line-height:1.1}
.bl{font-size:10.5px;letter-spacing:2.6px;color:var(--brass-soft);display:block}
.head-side{margin-inline-start:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(235,197,124,.22);border-radius:100px;padding:3px}
.langs button{background:none;border:none;color:#BCD5E0;font-family:var(--f-body);font-size:14px;font-weight:700;
  padding:6px 13px;border-radius:100px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--brass);color:#08202F}
.ms-back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:#BCD5E0;font-family:var(--f-body);font-size:13.5px;font-weight:500;border:1px solid rgba(235,197,124,.22);border-radius:100px;padding:7px 12px;white-space:nowrap}
.ms-back:hover{color:#fff;border-color:var(--brass)}
@media(max-width:640px){.ms-back{font-size:12.5px;padding:6px 9px}}
.wa-top{background:var(--brass);color:#08202F;font-weight:700;font-size:15px;padding:9px 17px;border-radius:100px;
  display:inline-flex;gap:8px;align-items:center;white-space:nowrap}
.wa-top:hover{background:var(--brass-soft)}
.wa-top svg{width:17px;height:17px;fill:currentColor}
#installBtn{display:none;background:rgba(255,255,255,.07);border:1px solid rgba(235,197,124,.35);color:#EBC57C;
  font-family:var(--f-body);font-size:14.5px;font-weight:700;padding:9px 15px;border-radius:100px;cursor:pointer;gap:7px;align-items:center;white-space:nowrap}
#installBtn.show{display:inline-flex}
#installBtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:5px}
.tabs::-webkit-scrollbar-thumb{background:rgba(235,197,124,.3);border-radius:9px}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.05);border:1px solid rgba(235,197,124,.2);color:#CFE2EB;
  font-family:var(--f-body);font-size:15px;font-weight:500;padding:9px 16px;border-radius:100px;cursor:pointer;
  transition:background .15s,color .15s;touch-action:manipulation;user-select:none}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{background:rgba(42,138,166,.25);color:#fff}
.tab[aria-selected="true"]{background:var(--brass);border-color:var(--brass);color:#08202F;font-weight:700}

main{padding:34px 0 90px;min-height:60vh}
.panel{display:none;animation:fade .22s ease both}
.panel.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.kick{color:var(--brass-soft);font-size:15px;margin-bottom:12px}
.hero h1{font-size:clamp(28px,4.6vw,44px);font-weight:900;color:#fff}
.hero h1 span{display:block;font-weight:500;font-size:clamp(18px,2.4vw,24px);color:var(--muted);margin-top:12px}
.hero p{color:#C3D8E2;margin-top:18px;max-width:58ch}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.chip{background:rgba(42,138,166,.2);border:1px solid rgba(235,197,124,.28);color:#EAF3F7;
  padding:9px 16px;border-radius:100px;font-size:15px;cursor:pointer;font-family:var(--f-body)}
.chip:hover{background:var(--brass);color:#08202F}
.compass{width:min(300px,74vw);display:block;margin-inline:auto}
.needle{transform-origin:250px 250px;animation:settle 2.2s cubic-bezier(.2,.9,.25,1) both}
@keyframes settle{0%{transform:rotate(-55deg)}62%{transform:rotate(8deg)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.needle{animation:none}}
@media(max-width:880px){.hero{grid-template-columns:1fr;gap:26px}.compass{order:-1;width:min(220px,60vw)}}

.svc{display:grid;grid-template-columns:1.25fr .75fr;gap:26px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;backdrop-filter:blur(6px)}
.svc-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.svc-ico{width:56px;height:56px;flex:none;border-radius:14px;background:rgba(42,138,166,.28);
  border:1px solid rgba(235,197,124,.3);display:flex;align-items:center;justify-content:center}
.svc-ico svg{width:28px;height:28px;stroke:var(--brass-soft);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.svc h2{font-size:clamp(21px,3vw,28px);font-weight:900;color:#fff}
.lede{color:#C3D8E2;font-size:17px}
ul.pts{list-style:none;display:grid;gap:11px;margin-top:18px}
ul.pts li{display:flex;gap:11px;align-items:flex-start;font-size:16.3px;color:#DCEAF0}
ul.pts li::before{content:"";width:9px;height:9px;margin-top:9px;flex:none;border-radius:50%;
  background:var(--brass);box-shadow:0 0 0 4px rgba(209,154,56,.18)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{font-size:13.6px;color:#BFDCE7;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:100px}
.side h3{font-size:19px;color:#fff;margin-bottom:8px}
.side p{color:var(--muted);font-size:15.6px;margin-bottom:20px}
.price{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
  background:#1FA855;color:#fff;font-weight:700;font-size:17px;padding:15px 20px;border-radius:100px}
.price:hover{background:#189246}
.price svg{width:20px;height:20px;fill:currentColor}
.note{margin-top:14px;font-size:14.6px;color:#9BBBC9;text-align:center}
@media(max-width:880px){.svc{grid-template-columns:1fr;gap:18px}.box{padding:22px}}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}
.mini{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:18px}
.mini b{display:block;color:var(--brass-soft);font-family:var(--f-head);font-size:16px;margin-bottom:6px}
.mini span{font-size:15.4px;color:#C3D8E2}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}

.c-list{list-style:none;display:grid;gap:14px;margin-top:16px}
.c-list li{display:flex;gap:12px;align-items:center;font-size:17px}
.c-list svg{width:21px;height:21px;stroke:var(--brass-soft);fill:none;stroke-width:1.7;flex:none}

footer{border-top:1px solid var(--line);background:rgba(6,25,37,.85);padding:20px 0;font-size:14.5px;color:#8FB0C1}
@media(max-width:640px){footer{padding-bottom:92px}}
.f-in{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.float-wa{position:fixed;inset-inline-start:16px;bottom:16px;z-index:40;width:54px;height:54px;border-radius:50%;
  background:#1FA855;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.4)}
.float-wa svg{width:29px;height:29px;fill:#fff}

#iosTip{display:none;position:fixed;inset-inline:14px;bottom:14px;z-index:60;background:rgba(8,32,47,.97);
  border:1px solid rgba(235,197,124,.35);border-radius:14px;padding:16px 18px;font-size:15px;color:#DCEAF0;box-shadow:0 12px 34px rgba(0,0,0,.5)}
#iosTip.show{display:block}
#iosTip b{color:#EBC57C}
#iosTip button{margin-top:10px;background:none;border:none;color:#9BBBC9;font-family:var(--f-body);font-size:14px;cursor:pointer;text-decoration:underline}
.offline-note{display:none;background:rgba(209,154,56,.16);border:1px solid rgba(235,197,124,.3);color:#EBC57C;
  border-radius:10px;padding:10px 14px;font-size:14.5px;margin-bottom:16px}
.offline-note.show{display:block}
.f-phones a{color:inherit;text-decoration:none}.f-phones{display:inline-flex;flex-direction:column;gap:2px;line-height:1.5;direction:ltr;text-align:left}.f-phones a{unicode-bidi:isolate}
.call-only{opacity:.75;font-size:.85em;margin-inline-start:6px}

/* ===== service orbit: the compass points at each service in turn ===== */
.orbit{position:relative}
.compass{width:min(380px,82vw);overflow:visible}
.needle-rot{transform-origin:250px 250px;transform-box:view-box;transition:transform 1.1s cubic-bezier(.3,1.35,.4,1)}
.needle{transform-box:view-box}
.spin{transform-origin:250px 250px;transform-box:view-box;animation:spin 60s linear infinite}
.spin.rev{animation-duration:90s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.ray{transform-origin:250px 250px;transform-box:view-box;transition:transform 1.1s cubic-bezier(.3,1.35,.4,1),opacity .5s}
.orbit.live .ray{opacity:.55}
.orb-i{cursor:pointer;outline:none}
.orb-b{transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.orb-i circle{fill:#0B2C3F;stroke:rgba(235,197,124,.35);stroke-width:1.5;transition:fill .4s,stroke .4s}
.orb-i svg path,.orb-i svg circle,.orb-i svg rect,.orb-i svg line,.orb-i svg polyline{fill:none;stroke:#A9C6D4;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.orb-i svg circle{fill:none;stroke-width:1.7}
.orb-i.on .orb-b{transform:scale(1.22)}
.orb-i.on>g>circle{fill:#D19A38;stroke:#EBC57C;filter:drop-shadow(0 0 14px rgba(235,197,124,.65))}
.orb-i.on svg *{stroke:#08202F !important}
.orb-i:hover>g>circle,.orb-i:focus-visible>g>circle{stroke:#EBC57C}
.orb-cap{text-align:center;margin-top:10px;min-height:52px}
.orb-cap b{display:block;font:700 19px var(--f-head);color:var(--brass-soft);transition:opacity .35s,transform .35s}
.orb-cap b.swap{opacity:0;transform:translateY(6px)}
.orb-cap small{color:var(--muted);font-size:13px}
@media(max-width:880px){.compass{width:min(270px,70vw)}.hero>div:last-child{order:-1}.orb-cap{min-height:44px}}

/* ===== service panels come alive ===== */
.panel.on .svc-ico{animation:pop .6s cubic-bezier(.2,1.5,.4,1) both}
.panel.on .svc-ico svg{animation:bob 3.2s ease-in-out .7s infinite}
@keyframes pop{from{transform:scale(.4) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.panel.on ul.pts li{animation:slideIn .55s cubic-bezier(.2,.9,.25,1) both}
.panel.on ul.pts li:nth-child(1){animation-delay:.12s}.panel.on ul.pts li:nth-child(2){animation-delay:.24s}
.panel.on ul.pts li:nth-child(3){animation-delay:.36s}.panel.on ul.pts li:nth-child(4){animation-delay:.48s}
.panel.on ul.pts li:nth-child(5){animation-delay:.6s}
@keyframes slideIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
html[dir="ltr"] .panel.on ul.pts li{animation-name:slideInL}
@keyframes slideInL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.panel.on .tag{animation:fade .5s ease both .7s}

/* per-service scene */
.scene{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:rgba(8,32,47,.55);padding:14px 12px 10px;overflow:hidden}
.scene svg{width:100%;height:auto;display:block}
.scene text{font-family:var(--f-body);fill:#DCEAF0}
.route-line{stroke:#2A8AA6;stroke-width:2;stroke-dasharray:5 7;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.route-dot{fill:#EBC57C;filter:drop-shadow(0 0 6px rgba(235,197,124,.8))}
.stop>circle{fill:#0B2C3F;stroke:#2A8AA6;stroke-width:2}
.stamp{transform-box:fill-box;transform-origin:center;opacity:0;animation:6s ease infinite both}
.stamp.s1{animation-name:st1}.stamp.s2{animation-name:st2}.stamp.s3{animation-name:st3}
@keyframes st1{0%,14%{opacity:0;transform:scale(1.9) rotate(-14deg)}20%,92%{opacity:1;transform:rotate(-8deg)}100%{opacity:0}}
@keyframes st2{0%,44%{opacity:0;transform:scale(1.9) rotate(-14deg)}50%,92%{opacity:1;transform:rotate(-8deg)}100%{opacity:0}}
@keyframes st3{0%,74%{opacity:0;transform:scale(1.9) rotate(-14deg)}80%,92%{opacity:1;transform:rotate(-8deg)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.stamp{animation:none;opacity:1}}
@media(prefers-reduced-motion:reduce){
  .spin,.panel.on .svc-ico,.panel.on .svc-ico svg,.panel.on ul.pts li,.panel.on .tag,.route-line{animation:none}
  .needle-rot,.ray{transition:none}
}
</style>
</head>

<header>
  <div class="wrap">
    <div class="bar">
      <div class="brand" id="brandBtn" role="link" tabindex="0">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="21" fill="none" stroke="#EBC57C" stroke-width="2"/>
          <path d="M24 7 L28.5 21.5 L41 24 L28.5 26.5 L24 41 L19.5 26.5 L7 24 L19.5 21.5 Z" fill="#EBC57C"/>

function show(name, push){
  var valid = (name==='home'||name==='contact'||ORDER.indexOf(name)>-1);
  if(!valid) name = 'home';
  current = name;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    var on = t.dataset.t === name;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    if(on) t.scrollIntoView({block:'nearest', inline:'center'});
  });
  Array.prototype.forEach.call(document.querySelectorAll('.panel'), function(p){
    p.classList.toggle('on', p.id === 'p-' + name);
  });
  window.scrollTo({top:0, behavior:'smooth'});
  if(push) history.replaceState(null, '', '#' + name);
}

  document.getElementById('installTxt').textContent = d.install;
  document.getElementById('waTopTxt').textContent = d.wa;
  document.getElementById('msBackTxt').textContent = (lang==='ar') ? '↩ Manage Smarter' : '↩ Manage Smarter';
  document.getElementById('waTop').href = wa(d.waGeneral);
  document.getElementById('waFloat').href = wa(d.waGeneral);

  document.getElementById('fCall').textContent = '('+d.contact.callOnly+')';
  document.getElementById('offlineNote').textContent = d.offline;
  document.getElementById('iosTxt').innerHTML = d.ios;

  document.getElementById('tabs').innerHTML = tabsHTML(d);
  document.getElementById('panels').innerHTML =
    homeHTML(d) + ORDER.map(function(k){ return svcHTML(d,k); }).join('') + contactHTML(d);

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){
    t.addEventListener('click', function(){ show(t.dataset.t, true); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function(b){
    b.addEventListener('click', function(){ show(b.dataset.go, true); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function(b){
    b.setAttribute('aria-pressed', b.dataset.l === lang ? 'true' : 'false');
  });
  show(current, false);
  startOrbit(d);
}

var orbT = null;
function startOrbit(d){
  if(orbT){ clearInterval(orbT); orbT=null; }
  var root=document.querySelector('.orbit'); if(!root) return;
  var items=[].slice.call(root.querySelectorAll('.orb-i')), rot=root.querySelector('.needle-rot'),
      ray=root.querySelector('.ray'), name=document.getElementById('orbName'), i=0, turns=0, paused=false;
  function point(n){
    items.forEach(function(el){ el.classList.toggle('on', +el.dataset.n===n); });
    var a = n*360/items.length + turns*360;
    rot.style.transform='rotate('+a+'deg)'; ray.style.transform='rotate('+a+'deg)';
    root.classList.add('live');
    name.classList.add('swap');
    setTimeout(function(){ name.textContent=d.s[items[n].dataset.k].tab; name.classList.remove('swap'); }, 220);
  }
  items.forEach(function(el){
    el.addEventListener('click', function(){ show(el.dataset.k, true); });
    el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); show(el.dataset.k, true); } });
    el.addEventListener('mouseenter', function(){ paused=true; i=+el.dataset.n; point(i); });
    el.addEventListener('mouseleave', function(){ paused=false; });
    el.addEventListener('focus', function(){ paused=true; i=+el.dataset.n; point(i); });
    el.addEventListener('blur', function(){ paused=false; });
  });
  setTimeout(function(){ point(0); }, RM?0:1900);
  if(RM) return;
  orbT=setInterval(function(){
    if(paused || document.hidden || current!=='home') return;
    i=(i+1)%items.length; if(i===0) turns++;
    point(i);
  }, 2300);
}

Array.prototype.forEach.call(document.querySelectorAll('.langs button'), function(b){
  b.addEventListener('click', function(){
    lang = b.dataset.l;
    try { localStorage.setItem('dl_lang', lang); } catch(e){}
    render();
  });
});
