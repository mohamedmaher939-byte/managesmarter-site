<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Smarter — إدارة مدرسية في مكان واحد</title>
<meta name="description" content="منصة تجمع أنظمة تشغيل المدرسة — الأنشطة والتقويم، الانضباط، التسجيل ومتابعة أولياء الأمور، ومهام المعلمين — في مكان واحد بثلاث لغات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --veil:#E3E8E2;
  --ink:#16302B; --body:#4B5F58;
  --muted:#78908A;
  --pine:#2E6B5E; --pine-2:#3E8C7A; --pine-ink:#12433A;
  --amber:#C08434; --amber-soft:#F3E6D2;
  --line:#D7DED8;
  --rad:14px;
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--body);
  font-family:"Tajawal","Rubik",system-ui,sans-serif;
  font-size:16.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mark,.price b,nav a{font-family:"Rubik","Tajawal",system-ui,sans-serif}
h1,h2,h3{color:var(--ink); font-weight:600; line-height:1.2; letter-spacing:-.015em}
h1{font-size:clamp(30px,5.2vw,52px); line-height:1.12; letter-spacing:-.03em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .mark{letter-spacing:0}
[dir="rtl"] h1{line-height:1.25}
h2{font-size:clamp(23px,3.2vw,33px); margin-bottom:14px}
h3{font-size:18.5px; margin-bottom:6px}
p{max-width:62ch}
a{color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:22px}
section{padding-block:clamp(54px,8vw,96px)}
.lede{font-size:18px;color:var(--body)}

/* ---------- nav ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(237,240,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:17px;text-decoration:none;letter-spacing:-.02em}
.mark svg{width:30px;height:30px;flex:none;overflow:visible}
.mark svg rect{transform-box:fill-box;transform-origin:center;animation:shuffle 5.4s ease-in-out infinite}
.mark svg rect:nth-child(2){animation-delay:.09s}
.mark svg rect:nth-child(3){animation-delay:.18s}
.mark svg rect:nth-child(4){animation-delay:.27s}
@keyframes shuffle{
  0%,38%   {transform:none}
  50%      {transform:translate(-5px,-4px) rotate(-24deg)}
  58%      {transform:translate(4px,5px)   rotate(19deg)}
  72%      {transform:translate(-3px,4px)  rotate(-11deg)}
  84%,100% {transform:none}
}
@media (prefers-reduced-motion:reduce){.mark svg rect{animation:none}}
.top nav{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.top nav a{text-decoration:none;font-size:14.5px;color:var(--body);padding:8px 11px;border-radius:8px}
.top nav a:hover{color:var(--ink);background:var(--veil)}
.top nav a.nav-dal{color:var(--pine);font-weight:500;border:1px solid var(--line);white-space:nowrap}
.top nav a.nav-dal:hover{background:var(--veil);color:var(--pine)}
@media(max-width:560px){.top nav a.nav-dal{font-size:13px;padding:6px 9px}}
.dl-sm{display:none}@media(max-width:700px){.dl-lg{display:none}.dl-sm{display:inline}}
@media(max-width:480px){.top .wrap{gap:8px;padding-inline:12px}.top nav{gap:4px}.mark{font-size:14px;gap:6px;line-height:1.15}.mark svg{width:24px;height:24px}.langs button{padding:5px 7px;font-size:12px}.top nav a.nav-dal,.top nav .btn.sm{padding:5px 8px;font-size:12.5px}}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{border:none;background:none;font:inherit;font-size:13px;font-weight:500;padding:6px 11px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--pine);color:#fff}
.hide-sm{display:none}
@media(min-width:880px){.hide-sm{display:flex}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 22px;border-radius:10px;font-weight:500;font-size:16px;text-decoration:none;
  background:var(--pine);color:#fff;border:1px solid var(--pine);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--pine-ink);border-color:var(--pine-ink)}
.btn.ghost{background:transparent;color:var(--pine-ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:9px 15px;font-size:14.5px}
.btn.wa{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.wa:hover{background:#A86F27;border-color:#A86F27}

/* ---------- hero ---------- */
.hero{padding-block:clamp(40px,6vw,76px) clamp(48px,7vw,84px)}
.hero .wrap{display:grid;gap:clamp(32px,5vw,56px);align-items:center}
@media(min-width:940px){.hero .wrap{grid-template-columns:1.02fr .98fr}}
.hero p{margin-top:18px;font-size:18.5px}
.hero .cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}
.hero small{display:block;margin-top:16px;color:var(--muted);font-size:14px}

/* ---------- assembly ---------- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;
  box-shadow:0 30px 60px -50px rgba(18,67,58,.5)}
.asm{width:100%;height:auto}
.asm .t{transition:transform .95s cubic-bezier(.2,.9,.25,1);
  transform-box:fill-box;transform-origin:center}
.asm .fin{transition:opacity .5s ease .78s}
.asm.loose .fin{opacity:0}
.asm.loose .t1 {transform:translate(-96px,-52px) rotate(-19deg)}
.asm.loose .t2 {transform:translate(74px,-64px)  rotate(13deg)}
.asm.loose .t3 {transform:translate(-58px,62px)  rotate(11deg)}
.asm.loose .t4 {transform:translate(88px,46px)   rotate(-14deg)}
.asm.loose .t5 {transform:translate(-112px,18px) rotate(22deg)}
.asm.loose .t6 {transform:translate(46px,80px)   rotate(-9deg)}
.asm.loose .t7 {transform:translate(108px,-18px) rotate(16deg)}
.asm.loose .t8 {transform:translate(-44px,-78px) rotate(-24deg)}
.asm.loose .t9 {transform:translate(64px,68px)   rotate(18deg)}
.asm.loose .t10{transform:translate(-86px,-14px) rotate(-13deg)}
.asm.loose .t11{transform:translate(24px,-86px)  rotate(9deg)}
.asm.loose .t12{transform:translate(-30px,88px)  rotate(-20deg)}
.asm.loose .t13{transform:translate(118px,34px)  rotate(24deg)}
.asm.loose .t14{transform:translate(-120px,-40px) rotate(15deg)}
.asm .t1{transition-delay:.03s}  .asm .t2{transition-delay:.08s}
.asm .t3{transition-delay:.13s}  .asm .t4{transition-delay:.18s}
.asm .t5{transition-delay:.23s}  .asm .t6{transition-delay:.28s}
.asm .t7{transition-delay:.33s}  .asm .t8{transition-delay:.38s}
.asm .t9{transition-delay:.43s}  .asm .t10{transition-delay:.48s}
.asm .t11{transition-delay:.53s} .asm .t12{transition-delay:.58s}
.asm .t13{transition-delay:.63s} .asm .t14{transition-delay:.68s}
.stage .bar{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stage .bar span{font-size:14px;color:var(--muted);flex:1}


/* ---------- live demo ---------- */
.demo .wrap{display:grid;gap:clamp(28px,4vw,52px);align-items:center}
@media(min-width:940px){.demo .wrap{grid-template-columns:.95fr 1.05fr}}
.tabs{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.tabs button{display:block;text-align:start;font:inherit;cursor:pointer;background:none;
  border:1px solid transparent;border-inline-start:3px solid var(--line);
  padding:13px 16px;border-radius:0 10px 10px 0;color:var(--muted);transition:.2s}
[dir="rtl"] .tabs button{border-radius:10px 0 0 10px}
.tabs button b{display:block;color:var(--ink);font-weight:500;font-size:16px;
  font-family:"Rubik","Tajawal",sans-serif}
.tabs button span{font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--surface);border-inline-start-color:var(--amber)}
.tabs button:hover{background:var(--surface)}
.solve{margin-top:22px;padding:15px 17px;background:var(--surface);
  border:1px solid var(--line);border-left:0;border-right:0;border-radius:0}
.solve b{color:var(--pine-ink);font-weight:500}

.phone{justify-self:center;width:min(330px,88vw);aspect-ratio:9/17.4;
  background:#132C28;border-radius:34px;padding:11px;
  box-shadow:0 40px 70px -48px rgba(18,67,58,.75)}
.screen{width:100%;height:100%;background:var(--bg);border-radius:25px;overflow:hidden;
  display:flex;flex-direction:column;font-size:11.5px;position:relative}
.scr-top{background:var(--pine-ink);color:#fff;padding:13px 14px 11px;display:flex;align-items:center;gap:9px;flex:none}
.scr-top .av{width:24px;height:24px;border-radius:7px;background:var(--amber);flex:none}
.scr-top b{font-size:12px;font-weight:500;display:block}
.scr-top i{font-style:normal;font-size:9.5px;color:#9CBBB2;display:block}
.pane{display:none;flex:1;padding:13px;overflow:hidden}
.pane.on{display:block}

/* pane A — calendar clash */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--surface);display:grid;place-items:center;
  font-style:normal;color:var(--muted);font-size:9px;border:1px solid var(--line)}
.cal i.ex{background:#E7EDF4;border-color:#CBD9E6;color:#5B7E9E}
.chip{position:absolute;background:var(--amber);color:#fff;font-size:9.5px;padding:4px 8px;
  border-radius:6px;box-shadow:0 6px 14px -8px rgba(0,0,0,.5);white-space:nowrap}
.warn{margin-top:11px;background:#FBEAE6;border:1px solid #F0C9BF;color:#9C4527;
  border-radius:8px;padding:8px 10px;font-size:10px;opacity:0}
.fixed{margin-top:8px;background:#E4EFE9;border:1px solid #BEDACB;color:#1F6B4C;
  border-radius:8px;padding:8px 10px;font-size:10px;opacity:0}
.run .chip{animation:chipMove 9s ease-in-out infinite}
.run .warn{animation:fadeStep 9s ease-in-out infinite}
.run .fixed{animation:fadeStep2 9s ease-in-out infinite}
@keyframes chipMove{
  0%,8%   {transform:translate(0,-26px) scale(.9);opacity:0}
  16%,42% {transform:translate(0,0) scale(1);opacity:1}
  52%,100%{transform:translate(-34%,42px) scale(1);opacity:1}
}
@keyframes fadeStep{0%,18%{opacity:0}26%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes fadeStep2{0%,54%{opacity:0}62%,94%{opacity:1}100%{opacity:0}}

/* pane B — case moving through departments */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 10px 3px;
  padding:9px 11px;font-size:10.5px;color:var(--body);max-width:85%}
.card{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;opacity:0}
.card b{font-size:11.5px;color:var(--ink);display:block}
.card small{color:var(--muted);font-size:9.5px}
.flow{display:flex;gap:5px;margin-top:9px}
.flow span{flex:1;text-align:center;font-size:8.5px;padding:5px 2px;border-radius:5px;
  background:var(--veil);color:var(--muted)}
.run .card{animation:popIn 9s ease-in-out infinite}
.run .flow span:nth-child(1){animation:lit 9s ease-in-out infinite .0s}
.run .flow span:nth-child(2){animation:lit 9s ease-in-out infinite 1.6s}
.run .flow span:nth-child(3){animation:lit 9s ease-in-out infinite 3.2s}
.run .flow span:nth-child(4){animation:litEnd 9s ease-in-out infinite 4.8s}
@keyframes popIn{0%,10%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
@keyframes lit{0%,22%{background:var(--veil);color:var(--muted)}
  30%,58%{background:var(--pine);color:#fff}66%,100%{background:#DCE8E3;color:var(--pine-ink)}}
@keyframes litEnd{0%,22%{background:var(--veil);color:var(--muted)}
  30%,100%{background:#1F6B4C;color:#fff}}

/* pane C — report builds itself */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.kpi b{display:block;font-family:"Rubik",sans-serif;font-size:18px;color:var(--pine-ink);line-height:1.1}
.kpi span{font-size:9px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:62px;margin-top:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px}
.bars i{flex:1;background:var(--pine-2);border-radius:3px 3px 0 0;height:20%}
.ready{margin-top:9px;background:var(--pine-ink);color:#fff;border-radius:8px;
  padding:8px 10px;font-size:10px;opacity:0;display:flex;justify-content:space-between}
.run .bars i:nth-child(1){animation:grow 9s ease-in-out infinite .1s}
.run .bars i:nth-child(2){animation:grow 9s ease-in-out infinite .25s}
.run .bars i:nth-child(3){animation:grow 9s ease-in-out infinite .4s}
.run .bars i:nth-child(4){animation:grow 9s ease-in-out infinite .55s}
.run .bars i:nth-child(5){animation:grow 9s ease-in-out infinite .7s}
.run .ready{animation:fadeStep2 9s ease-in-out infinite}
.run .kpi b{animation:softIn 9s ease-in-out infinite}
@keyframes grow{0%,6%{height:8%}34%,100%{height:var(--h,60%)}}
@keyframes softIn{0%,8%{opacity:.15}22%,100%{opacity:1}}


/* pane D — discipline + behaviour handbook */
.inc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  display:flex;gap:9px;align-items:flex-start;opacity:0}
.inc .lv{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:#fff;font-family:"Rubik",sans-serif;font-size:12px;position:relative}
.inc .lv span{position:absolute;inset:0;display:grid;place-items:center;border-radius:7px;opacity:0}
.inc .lv .l1{background:#2E6B5E}.inc .lv .l2{background:#C9A227}.inc .lv .l3{background:#C0603A}
.inc b{font-size:11px;color:var(--ink);display:block}
.inc small{font-size:9.5px;color:var(--muted)}
.rule{margin-top:9px;background:#F4F1E7;border:1px solid #E3DBC4;border-radius:9px;
  padding:9px 10px;font-size:10px;color:#6F5A21;opacity:0}
.acts{display:grid;gap:5px;margin-top:9px}
.acts div{background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-size:9.5px;color:var(--muted);display:flex;justify-content:space-between;opacity:0}
.acts div i{font-style:normal;color:#1F6B4C;font-weight:700}
.run .inc{animation:popIn 11s ease-in-out infinite}
.run .inc .lv .l1{animation:lvFade 11s ease-in-out infinite}
.run .inc .lv .l2{animation:lvFade 11s ease-in-out infinite 1.7s}
.run .inc .lv .l3{animation:lvHold 11s ease-in-out infinite 3.4s}
.run .rule{animation:popIn 11s ease-in-out infinite 1.1s}
.run .acts div:nth-child(1){animation:tick 11s ease-in-out infinite 3.9s}
.run .acts div:nth-child(2){animation:tick 11s ease-in-out infinite 4.9s}
.run .acts div:nth-child(3){animation:tick 11s ease-in-out infinite 5.9s}
@keyframes lvFade{0%,4%{opacity:0}8%,14%{opacity:1}18%,100%{opacity:0}}
@keyframes lvHold{0%,2%{opacity:0}6%,100%{opacity:1}}
@keyframes tick{0%,2%{opacity:0;transform:translateX(6px)}10%,100%{opacity:1;transform:none}}

/* pane E — task follow-up */
.prog{height:6px;border-radius:4px;background:var(--veil);overflow:hidden;margin:9px 0 11px}
.prog i{display:block;height:100%;background:var(--pine-2);width:12%;border-radius:4px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:10px}
.task .who{flex:none;width:20px;height:20px;border-radius:50%;background:var(--veil);
  display:grid;place-items:center;font-size:8.5px;color:var(--pine-ink)}
.task .tx{flex:1;color:var(--ink)}
.task .tx small{display:block;color:var(--muted);font-size:8.5px}
.task .st{position:relative;width:44px;height:17px;flex:none}
.task .st span{position:absolute;inset:0;border-radius:5px;display:grid;place-items:center;font-size:8.5px}
.task .st .late{background:#FBEAE6;color:#9C4527}
.task .st .done{background:#E4EFE9;color:#1F6B4C;opacity:0}
.task.fresh{opacity:0}
.run .prog i{animation:fill 11s ease-in-out infinite}
.run .task:nth-child(2) .st .done{animation:swap 11s ease-in-out infinite 2.2s}
.run .task:nth-child(2) .st .late{animation:swapOut 11s ease-in-out infinite 2.2s}
.run .task:nth-child(4) .st .done{animation:swap 11s ease-in-out infinite 4.4s}
.run .task:nth-child(4) .st .late{animation:swapOut 11s ease-in-out infinite 4.4s}
.run .task.fresh{animation:slideIn 11s ease-in-out infinite 6.4s}
@keyframes fill{0%,8%{width:12%}40%{width:46%}70%,100%{width:78%}}
@keyframes swap{0%,4%{opacity:0}12%,100%{opacity:1}}
@keyframes swapOut{0%,4%{opacity:1}12%,100%{opacity:0}}
@keyframes slideIn{0%,2%{opacity:0;transform:translateY(-10px)}10%,100%{opacity:1;transform:none}}

/* ---------- chaos strip ---------- */
.chaos{background:var(--surface);border-block:1px solid var(--line)}
.chaos ul{list-style:none;display:grid;gap:0;margin-top:26px}
@media(min-width:760px){.chaos ul{grid-template-columns:repeat(2,1fr);column-gap:44px}}
.chaos li{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}
.chaos li i{flex:none;width:9px;height:9px;border-radius:2px;background:var(--amber);margin-top:11px;transform:rotate(12deg)}
.chaos li b{display:block;color:var(--ink);font-weight:500;font-family:"Rubik","Tajawal",sans-serif}
.chaos li p{font-size:15px;color:var(--muted);margin-top:2px}

/* ---------- systems ---------- */
.sys{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
@media(min-width:820px){.sys{grid-template-columns:1fr 1fr;column-gap:48px}}
.sys article{padding:24px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.sys .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--amber-soft);
  display:grid;place-items:center;color:var(--pine-ink)}
.sys .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sys p{font-size:15.5px}
.sys .tag{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--pine);
  background:#E4EDE9;padding:3px 9px;border-radius:999px}

/* ---------- steps ---------- */
.steps{counter-reset:s;display:grid;gap:22px;margin-top:34px}
@media(min-width:780px){.steps{grid-template-columns:repeat(3,1fr);gap:30px}}
.steps li{list-style:none;counter-increment:s;position:relative;padding-top:46px}
.steps li::before{content:counter(s);position:absolute;top:0;inset-inline-start:0;
  width:34px;height:34px;border-radius:50%;background:var(--pine);color:#fff;
  display:grid;place-items:center;font-family:"Rubik",sans-serif;font-size:15px;font-weight:500}
.steps p{font-size:15.5px;color:var(--muted)}

/* ---------- trust ---------- */
.trust{background:var(--pine-ink);color:#CFE0DA}
.trust h2{color:#fff}
.trust .grid{display:grid;gap:26px;margin-top:32px}
@media(min-width:800px){.trust .grid{grid-template-columns:repeat(4,1fr)}}
.trust h3{color:#fff;font-size:16.5px;margin-bottom:5px}
.trust p{font-size:14.5px;color:#A9C4BC;max-width:34ch}
.trust .rule{width:26px;height:2px;background:var(--amber);margin-bottom:14px}


/* ---------- who / faq ---------- */
.who-box{display:grid;gap:26px;align-items:start}
@media(min-width:880px){.who-box{grid-template-columns:.85fr 1.15fr}}
.who-box .yrs{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:26px 24px;text-align:center}
.who-box .yrs b{display:block;font-family:"Rubik",sans-serif;font-size:56px;line-height:1;
  color:var(--pine-ink);font-weight:600}
.who-box .yrs span{display:block;margin-top:8px;font-size:15px;color:var(--muted)}
.who-box .yrs hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.who-box .yrs em{font-style:normal;font-size:14px;color:var(--body)}
.who-box p+p{margin-top:14px}

.faq{margin-top:30px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:18px 0;display:flex;gap:14px;align-items:flex-start;
  color:var(--ink);font-family:"Rubik","Tajawal",sans-serif;font-weight:500;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-inline-start:auto;color:var(--amber);font-size:22px;
  line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 0 20px;font-size:15.5px;color:var(--body);max-width:70ch}

/* ---------- pricing ---------- */
.plans{display:grid;gap:18px;margin-top:34px}
@media(min-width:860px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:26px 22px;display:flex;flex-direction:column}
.plan.mid{border-color:var(--pine);box-shadow:0 24px 46px -40px rgba(18,67,58,.6)}
.plan .price{font-family:"Rubik",sans-serif;font-size:30px;color:var(--pine-ink);font-weight:600;letter-spacing:.04em;margin:12px 0 4px}
.plan .price span{color:var(--line)}
.plan .per{font-size:13.5px;color:var(--muted)}
.plan ul{list-style:none;margin:18px 0 22px;display:grid;gap:9px}
.plan li{font-size:15px;display:flex;gap:9px;align-items:flex-start}
.plan li svg{width:17px;height:17px;flex:none;margin-top:4px;stroke:var(--pine-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plan .btn{margin-top:auto}
.note{margin-top:18px;font-size:14.5px;color:var(--muted)}

/* ---------- contact ---------- */
.contact .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:clamp(28px,4vw,44px);display:grid;gap:26px;align-items:center}
@media(min-width:840px){.contact .box{grid-template-columns:1.1fr .9fr}}
.ways{display:grid;gap:11px}
.way{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;text-decoration:none;background:var(--bg)}
.way:hover{border-color:var(--pine-2)}
.way svg{width:22px;height:22px;flex:none}
.way b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.way span{font-size:14px;color:var(--muted);direction:ltr;unicode-bidi:embed}

footer{border-top:1px solid var(--line);padding-block:28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
</style>

wh_p2:["هذه الأنظمة لم تُصمَّم في مكتب برمجة ثم تُعرض على المدارس. بُنيت داخل المدرسة، لحل مشكلات كنا نقع فيها بأنفسنا كل أسبوع، واستُخدمت قبل أن تُباع.",

q1:["إذا أوقفنا الاشتراك، ماذا يحدث لبياناتنا؟","If we stop the subscription, what happens to our data?","Aboneliği durdurursak verilerimize ne olur?"],
a1:["تُسلَّم لكم كاملة بصيغة Excel وJSON خلال أيام، ثم تُحذف من الخوادم عند طلبكم. البيانات مدرسية وليست ملكًا لنا، ولا نحتجزها لإجباركم على التجديد.",
    "You receive all of it in Excel and JSON within days, then it is deleted from the servers at your request. The data belongs to the school, not to us, and we do not hold it back to force a renewal.",

q2:["موظفونا ليسوا على دراية بالتكنولوجيا. هل سيستخدمونه فعلًا؟","Our staff are not technical. Will they actually use it?","Personelimiz teknoloji bilmiyor. Gerçekten kullanır mı?"],
a2:["الشاشة الواحدة تحتاج دقيقتين للشرح: زر واحد للإضافة، وقائمة للبحث. لا تنصيب على الأجهزة، ولا برنامج يُفتح — رابط وكلمة مرور. ومن يرفض التعلم عادةً يرفض لأن النظام معقّد، لا لأنه غير قادر.",
    "One screen takes two minutes to explain: one button to add, one list to search. Nothing to install and no program to open — a link and a password. People who refuse to learn usually refuse because the system is complicated, not because they cannot.",
    "Tek ekranı anlatmak iki dakika sürer: eklemek için bir düğme, aramak için bir liste. Kurulum yok, açılacak program yok — bir bağlantı ve bir şifre. Öğrenmeyi reddedenler genelde yapamadıkları için değil, sistem karmaşık olduğu için reddeder."],
q3:["هل نحتاج إنترنت طوال الوقت؟","Do we need internet all the time?","Sürekli internet gerekiyor mu?"],
a3:["نعم، لأن البيانات مركزية ويراها الجميع لحظيًا — وهذا هو سبب وجود النظام أصلًا. الاتصال المطلوب عادي تمامًا، ويعمل على بيانات الهاتف. وإن كانت شبكة مدرستكم ضعيفة، قولوا لنا قبل البدء.",
    "Yes, because the data is central and everyone sees it live — which is the point of the system. The connection needed is ordinary and works on mobile data. If your school network is weak, tell us before we start.",
    "Evet, çünkü veriler merkezîdir ve herkes anlık görür — sistemin amacı da budur. Gereken bağlantı sıradandır, mobil veriyle de çalışır. Okul ağınız zayıfsa başlamadan önce söyleyin."],
q4:["نحتاج تعديلات خاصة بمدرستنا. هل هذا ممكن؟","We need changes specific to our school. Is that possible?","Okulumuza özel değişiklikler gerekiyor. Mümkün mü?"],
a4:["الأسماء والصفوف والتصنيفات ومستويات اللائحة تُضبط لكم عند التجهيز، وهذه ليست تعديلات برمجية. أما إضافة شاشة أو نظام جديد فله وقت وتكلفة نتفق عليهما مسبقًا — ولن نقول نعم لكل طلب في المكالمة الأولى.",
    "Names, grades, categories and policy levels are configured for you at setup, and none of that is custom development. Adding a new screen or system has a timeline and a cost agreed in advance — and we will not say yes to every request on the first call.",
    "Adlar, sınıflar, kategoriler ve yönetmelik düzeyleri kurulumda size göre ayarlanır; bunlar yazılım geliştirme değildir. Yeni bir ekran veya sistem eklemek ise önceden anlaşılan bir süre ve maliyet gerektirir — ilk görüşmede her isteğe evet demeyiz."],
q5:["عندنا ملفات Excel من سنوات. هل نبدأ من الصفر؟","We have years of Excel files. Do we start from zero?","Yıllara yayılan Excel dosyalarımız var. Sıfırdan mı başlıyoruz?"],
a5:["لا. تُنقل ملفاتكم الحالية إلى النظام عند التجهيز، ويبقى التصدير إلى Excel متاحًا في أي وقت. الملف القديم يظل يعمل بجانب النظام حتى تطمئنوا، ثم تتركونه وحدكم.",
    "No. Your existing files are moved across at setup, and export back to Excel stays available at any time. The old file keeps working alongside the system until you are comfortable, then you drop it yourselves.",
    "Hayır. Mevcut dosyalarınız kurulumda aktarılır; Excel'e dışa aktarma her zaman açıktır. Eski dosya, siz rahat edene kadar sistemin yanında çalışmaya devam eder; sonra kendiniz bırakırsınız."],

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function paint(){
  document.documentElement.lang=L[LI];
  document.documentElement.dir=LI===0?"rtl":"ltr";
  $$("[data-i]").forEach(e=>{
    const v=D[e.dataset.i]; if(!v) return;
    e.textContent=v[LI];
    if(e.dataset.i==="h1"){e.innerHTML=v[LI].split("\n").map(x=>`<span style="display:block">${x}</span>`).join("");}
  });
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===L[LI]));
  const a=$(".asm"), btn=$("#asmBtn");
  btn.textContent = a.classList.contains("loose") ? D.asm_btn[LI] : D.asm_btn2[LI];
  document.title = LI===0 ? "Manage Smarter — إدارة مدرسية في مكان واحد"
    : LI===1 ? "Manage Smarter — school operations in one place"
    : "Manage Smarter — okul yönetimi tek yerde";
}
$$(".langs button").forEach(b=>b.onclick=()=>{LI=L.indexOf(b.dataset.l);paint();});
$("#asmBtn").onclick=()=>{$(".asm").classList.toggle("loose");paint();};
$("#yr").textContent=new Date().getFullYear();
paint();


/* demo panes: click to switch, and rotate on their own */
const panes=$$(".pane"), tabs=$$(".tabs button");
let pi=0, timer=null;
function showPane(i){
  pi=i;
  panes.forEach((p,n)=>{p.classList.toggle("on",n===i);p.classList.remove("run");});
  void panes[i].offsetWidth;            // restart the animation cleanly
  panes[i].classList.add("run");
  tabs.forEach((b,n)=>b.setAttribute("aria-selected",n===i));
}
function cycle(){clearInterval(timer);timer=setInterval(()=>showPane((pi+1)%panes.length),9000);}
tabs.forEach((b,n)=>b.onclick=()=>{showPane(n);cycle();});
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){showPane(0);cycle();}

/* one orchestrated moment: the pieces settle once, shortly after load */
const asm=$(".asm");
const settle=()=>{asm.classList.remove("loose");paint();};
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  setTimeout(settle,900);
}else{ settle(); }
</script>
