<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Smarter — إدارة مدرسية في مكان واحد</title>
<meta name="description" content="منصة تجمع أنظمة تشغيل المدرسة — الأنشطة والتقويم، الانضباط، التسجيل ومتابعة أولياء الأمور، ومهام المعلمين — في مكان واحد بثلاث لغات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EC; --surface:#FFFFFF; --veil:#E3E8E2;
  --ink:#16302B; --body:#4B5F58;
  --muted:#78908A;
  --pine:#2E6B5E; --pine-2:#3E8C7A; --pine-ink:#12433A;
  --amber:#C08434; --amber-soft:#F3E6D2;
  --line:#D7DED8;
  --rad:14px;
  --maxw:1120px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{overflow-x:clip}
body{
  background:var(--bg); color:var(--body);
  font-family:"Tajawal","Rubik",system-ui,sans-serif;
  font-size:16.5px; line-height:1.75; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mark,.price b,nav a{font-family:"Rubik","Tajawal",system-ui,sans-serif}
h1,h2,h3{color:var(--ink); font-weight:600; line-height:1.2; letter-spacing:-.015em}
h1{font-size:clamp(30px,5.2vw,52px); line-height:1.12; letter-spacing:-.03em}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] .mark{letter-spacing:0}
[dir="rtl"] h1{line-height:1.25}
h2{font-size:clamp(23px,3.2vw,33px); margin-bottom:14px}
h3{font-size:18.5px; margin-bottom:6px}
p{max-width:62ch}
a{color:inherit}
img,svg{display:block;max-width:100%}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:22px}
section{padding-block:clamp(54px,8vw,96px)}
.lede{font-size:18px;color:var(--body)}

/* ---------- nav ---------- */
.top{position:sticky;top:0;z-index:50;background:rgba(237,240,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:66px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:17px;text-decoration:none;letter-spacing:-.02em}
.mark svg{width:30px;height:30px;flex:none;overflow:visible}
.mark svg rect{transform-box:fill-box;transform-origin:center;animation:shuffle 5.4s ease-in-out infinite}
.mark svg rect:nth-child(2){animation-delay:.09s}
.mark svg rect:nth-child(3){animation-delay:.18s}
.mark svg rect:nth-child(4){animation-delay:.27s}
@keyframes shuffle{
  0%,38%   {transform:none}
  50%      {transform:translate(-5px,-4px) rotate(-24deg)}
  58%      {transform:translate(4px,5px)   rotate(19deg)}
  72%      {transform:translate(-3px,4px)  rotate(-11deg)}
  84%,100% {transform:none}
}
@media (prefers-reduced-motion:reduce){.mark svg rect{animation:none}}
.top nav{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.top nav a{text-decoration:none;font-size:14.5px;color:var(--body);padding:8px 11px;border-radius:8px}
.top nav a:hover{color:var(--ink);background:var(--veil)}
.top nav a.nav-dal{color:var(--pine);font-weight:500;border:1px solid var(--line);white-space:nowrap}
.top nav a.nav-dal:hover{background:var(--veil);color:var(--pine)}
@media(max-width:560px){.top nav a.nav-dal{font-size:13px;padding:6px 9px}}
.dl-sm{display:none}@media(max-width:700px){.dl-lg{display:none}.dl-sm{display:inline}}
@media(max-width:480px){.top .wrap{gap:8px;padding-inline:12px}.top nav{gap:4px}.mark{font-size:14px;gap:6px;line-height:1.15}.mark svg{width:24px;height:24px}.langs button{padding:5px 7px;font-size:12px}.top nav a.nav-dal,.top nav .btn.sm{padding:5px 8px;font-size:12.5px}}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{border:none;background:none;font:inherit;font-size:13px;font-weight:500;padding:6px 11px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--pine);color:#fff}
.hide-sm{display:none}
@media(min-width:880px){.hide-sm{display:flex}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 22px;border-radius:10px;font-weight:500;font-size:16px;text-decoration:none;
  background:var(--pine);color:#fff;border:1px solid var(--pine);cursor:pointer;font-family:inherit}
.btn:hover{background:var(--pine-ink);border-color:var(--pine-ink)}
.btn.ghost{background:transparent;color:var(--pine-ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface)}
.btn.sm{padding:9px 15px;font-size:14.5px}
.btn.wa{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.wa:hover{background:#A86F27;border-color:#A86F27}

/* ---------- hero ---------- */
.hero{padding-block:clamp(40px,6vw,76px) clamp(48px,7vw,84px)}
.hero .wrap{display:grid;gap:clamp(32px,5vw,56px);align-items:center}
@media(min-width:940px){.hero .wrap{grid-template-columns:1.02fr .98fr}}
.hero p{margin-top:18px;font-size:18.5px}
.hero .cta{display:flex;flex-wrap:wrap;gap:11px;margin-top:28px}
.btn.try{background:var(--pine);border-color:var(--pine);color:#fff}
.btn.try:hover{background:var(--pine-ink);border-color:var(--pine-ink);color:#fff}
.try-note{font-size:13.5px;color:var(--muted);margin-top:10px}
@media(max-width:700px){.nav-try{display:none}}
.hero small{display:block;margin-top:16px;color:var(--muted);font-size:14px}


/* ---------- school world (3D) ---------- */
.world{background:linear-gradient(180deg,var(--bg),#E4EBE4);overflow:hidden}
.world h2+p{max-width:60ch;margin-top:10px}
.campus{perspective:1600px;margin:30px auto 0;max-width:980px}
.campus .fl{transform-style:preserve-3d;transform:rotateX(var(--rx,22deg)) rotateY(var(--ry,0deg)) rotateZ(var(--rz,-3deg)) scale(var(--sc,.9));
  will-change:transform;border-radius:28px;background:#F6F0E4;box-shadow:0 60px 80px -60px rgba(18,67,58,.55)}
.campus .fl{overflow:hidden}
.campus img{display:block;width:100%;height:auto;border-radius:28px;animation:drone 24s ease-in-out infinite alternate}
@keyframes drone{from{transform:scale(1.03) translate(1.5%,0)}to{transform:scale(1.15) translate(-2%,1%)}}
@keyframes bob{50%{transform:translateY(-10px)}}
.scns{display:grid;gap:18px;margin-top:34px;grid-template-columns:repeat(3,1fr)}
@media(max-width:860px){.scns{grid-template-columns:repeat(2,1fr);gap:12px}}
.scn{margin:0;perspective:900px;display:block;text-decoration:none}
.scn .in{position:relative;height:100%;border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);
  transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .35s cubic-bezier(.2,.9,.25,1),box-shadow .35s;
  box-shadow:0 24px 40px -34px rgba(18,67,58,.6)}
.scn:hover .in{box-shadow:0 34px 50px -30px rgba(18,67,58,.6)}
.scn img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;transition:transform .6s}
.scn:hover img{transform:scale(1.05)}
.scn figcaption{padding:12px 14px 14px}
.scn figcaption b{display:block;font:600 15.5px "Rubik","Tajawal",sans-serif;color:var(--ink)}
.scn figcaption span{display:block;font-size:14px;color:var(--muted);line-height:1.5;margin-top:2px}
.cta-card .in{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:8px;padding:22px;
  background:radial-gradient(circle at 20% 15%,#3E8C7A,#12433A);color:#fff;border:none;min-height:100%}
.cta-card b{font:600 19px "Rubik","Tajawal",sans-serif}
.cta-card span{font-size:14.5px;opacity:.85;line-height:1.5}
@media(max-width:520px){.scn figcaption{padding:9px 10px 11px}.scn figcaption b{font-size:14px}.scn figcaption span{font-size:12.5px}.cta-card b{font-size:16px}}

/* living photos: slow camera moves + small story overlays */
.ph{position:relative;overflow:hidden;aspect-ratio:4/3}
.ph img{width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;animation:kb 16s ease-in-out infinite alternate}
.kb-students img{transform-origin:50% 45%;animation-name:kbIn}
.kb-teacher img{transform-origin:70% 40%}
.kb-activities img{animation-name:kbPan;animation-duration:18s}
.kb-office img{transform-origin:20% 45%;animation-name:kbIn;animation-duration:20s}
.kb-guidance img{transform-origin:55% 35%}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-2%,-1.5%)}}
@keyframes kbIn{from{transform:scale(1)}to{transform:scale(1.14)}}
@keyframes kbPan{from{transform:scale(1.14) translateX(4%)}to{transform:scale(1.14) translateX(-4%)}}
.scn:hover .ph img{animation-play-state:paused}
.scr{position:absolute;left:5.5%;top:25%;width:26%;display:grid;grid-template-columns:repeat(3,1fr);gap:5%;padding:2%;pointer-events:none}
.scr i{aspect-ratio:1.6;border-radius:4px;background:rgba(255,255,255,.0);animation:tick 4.8s infinite}
.scr i:nth-child(2){animation-delay:.8s}.scr i:nth-child(3){animation-delay:1.6s}.scr i:nth-child(4){animation-delay:2.4s}.scr i:nth-child(5){animation-delay:3.2s}.scr i:nth-child(6){animation-delay:4s}
@keyframes tick{0%,100%{background:rgba(255,255,255,0)}8%{background:rgba(192,132,52,.75);box-shadow:0 0 10px rgba(192,132,52,.8)}22%{background:rgba(255,255,255,0)}}
.bub{position:absolute;display:flex;gap:4px;padding:7px 10px;border-radius:14px;background:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35);opacity:0;animation:talk 6s infinite}
.bub i{width:6px;height:6px;border-radius:50%;background:var(--pine);animation:dots 1s infinite}
.bub i:nth-child(2){animation-delay:.15s}.bub i:nth-child(3){animation-delay:.3s}
.b1{left:44%;top:9%;border-bottom-left-radius:3px}
.b2{right:8%;top:30%;border-bottom-right-radius:3px;animation-delay:3s}
.b2 i{background:var(--amber)}
@keyframes talk{0%,5%{opacity:0;transform:translateY(6px) scale(.9)}10%,42%{opacity:1;transform:none}48%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes dots{50%{transform:translateY(-3px);opacity:.5}}
@media(prefers-reduced-motion:reduce){.ph img,.scr i,.bub{animation:none}.bub{opacity:1}}

/* real video loops, loaded only when visible */
.ph .sv,.campus .sv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s;border-radius:inherit}
.campus .fl{position:relative}
.sv.on{opacity:1}
.ph:has(.sv.on) img,.campus .fl:has(.sv.on) img{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){.sv{display:none}}

/* ================= the film behind everything ================= */
.backdrop{position:fixed;inset:0;z-index:-2;background:#07120F;overflow:hidden}
.backdrop img.bp,.backdrop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.backdrop video{opacity:0;transition:opacity 1.4s ease}
.backdrop video.on{opacity:1}
.backdrop::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(7,18,15,.72),rgba(7,18,15,.80) 40%,rgba(7,18,15,.88));backdrop-filter:blur(2px)}
:root{
  --bg:transparent; --surface:rgba(255,255,255,.07); --veil:rgba(255,255,255,.09); --line:rgba(255,255,255,.14);
  --ink:#EEF6F3; --body:#DCEAE5; --muted:#AFC6BF; --pine-ink:#BFE3D7; --amber-soft:rgba(192,132,52,.18);
}
body{background:transparent;color:var(--body)}
.top{background:rgba(7,18,15,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.chaos{background:rgba(7,18,15,.42);border-block:1px solid var(--line)}
.trust{background:rgba(18,67,58,.55);color:#DDECE7}
section,.demo,.hero{position:relative;z-index:1}
.card,.stage,.plan,.msg,.kpi,.inc,.task,.acts div,.cal i,.solve,.sys article{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage{background:rgba(255,255,255,.08);border-color:var(--line);box-shadow:0 30px 60px -40px rgba(0,0,0,.8)}
.stage .orb{background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.08),rgba(255,255,255,.02));border-radius:14px}
.stage .bar span{color:var(--ink)}
.nd{background:rgba(255,255,255,.90);border-color:rgba(255,255,255,.4);color:#16302B;box-shadow:0 10px 22px -14px rgba(0,0,0,.8)}
.orb.chaos .nd{background:rgba(250,244,232,.9);border-color:rgba(217,199,168,.7);color:#5B5342}
.orb-lines line{stroke:rgba(191,227,215,.5)}
.btn.ghost{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.05)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.langs{background:rgba(255,255,255,.06)}
.plan.mid{border-color:var(--amber);box-shadow:0 0 0 1px rgba(192,132,52,.25),0 30px 60px -40px rgba(192,132,52,.5)}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.12)}
details{border-color:var(--line)}
footer{border-top:1px solid var(--line);background:rgba(7,18,15,.55)}
.soc a{background:rgba(255,255,255,.07);border-color:var(--line);color:var(--ink)}
.film{height:clamp(300px,56svh,540px)}
@media(prefers-reduced-motion:reduce){.backdrop video{display:none}}

/* ================= film bands: the principal's evening ================= */
.film{position:relative;height:clamp(320px,62svh,620px);overflow:hidden;background:#07120F;isolation:isolate}
.film video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease}
.film video.on{opacity:1}
.film .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.film::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,18,15,.55),rgba(7,18,15,.18) 35%,rgba(7,18,15,.65))}
.film .over{position:relative;z-index:3;height:100%;display:grid;place-content:center;text-align:center;padding:0 22px;color:#fff}
.film .over b{display:block;font:600 clamp(21px,3.4vw,38px)/1.25 "Rubik","Tajawal",sans-serif;text-wrap:balance;
  text-shadow:0 2px 24px rgba(0,0,0,.55)}
.film .over span{display:block;margin-top:10px;font-size:clamp(14.5px,1.7vw,18px);color:#D8E7E1;text-wrap:balance}
.film .over .row{margin-top:20px;display:flex;gap:11px;justify-content:center;flex-wrap:wrap}
.film.key::after{background:linear-gradient(180deg,rgba(7,18,15,.5),rgba(10,26,20,.25) 40%,rgba(7,18,15,.78))}
.film.key .over b{color:#F3D7AE}
@media(prefers-reduced-motion:reduce){.film video{display:none}}

/* alive buttons */
.btn,.scn,.snd{will-change:transform}
.btn{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.9,.25,1),background .25s,box-shadow .25s,border-color .25s}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(120px circle at var(--bx,50%) var(--by2,50%),rgba(255,255,255,.22),transparent 60%);
  opacity:0;transition:opacity .3s;pointer-events:none}
.btn:hover::after{opacity:1}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.99)}

/* reveal from depth */
.rv{opacity:0;transform:perspective(900px) translateY(46px) rotateX(16deg);transition:opacity .9s ease,transform 1s cubic-bezier(.2,.9,.25,1)}
.rv.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.campus img{animation:none}}

/* ---------- assembly ---------- */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 18px 14px;
  box-shadow:0 30px 60px -50px rgba(18,67,58,.5)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.orb{position:relative;width:100%;aspect-ratio:1/.86;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:radial-gradient(circle at 50% 50%,#F4F7F3 0,#fff 62%);border-radius:14px;overflow:hidden;cursor:grab}
.orb-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.orb-lines line{stroke:#BFD3CB;stroke-width:1.4;transition:opacity .6s}
.orb-lines line.on{stroke:var(--amber);stroke-width:2;stroke-dasharray:5 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.orb.chaos .orb-lines{opacity:0}
.orb-lines{transition:opacity .8s}
.core{position:absolute;left:50%;top:50%;z-index:6;width:23%;aspect-ratio:1;border-radius:50%;
  transform:translate(-50%,-50%);display:grid;place-content:center;justify-items:center;gap:4px;
  background:radial-gradient(circle at 35% 30%,#3E8C7A,#12433A);color:#fff;
  box-shadow:0 0 0 8px rgba(46,107,94,.08),0 18px 40px -18px rgba(18,67,58,.7);transition:transform .9s cubic-bezier(.2,.9,.25,1),opacity .6s}
.core svg{width:34%;height:auto}
.core b{font:600 clamp(8px,1.3vw,11px) "Rubik",sans-serif;letter-spacing:.01em;white-space:nowrap}
.core::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid rgba(46,107,94,.35);animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.92);opacity:1}to{transform:scale(1.35);opacity:0}}
.orb.chaos .core{transform:translate(-50%,-50%) scale(.55);opacity:.35}
.orb.chaos .core::after{animation:none}
.nd{position:absolute;left:0;top:0;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 5px;
  background:#fff;border:1px solid var(--line);border-radius:999px;white-space:nowrap;
  font:500 clamp(11px,1.5vw,13px) "Rubik","Tajawal",sans-serif;color:var(--ink);
  box-shadow:0 6px 16px -10px rgba(18,67,58,.45);will-change:transform;cursor:pointer;transition:border-color .3s,box-shadow .3s,background .3s}
[dir=rtl] .nd{padding:5px 5px 5px 11px}
.nd i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--pine);flex:none}
.nd i svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.orb.chaos .nd{background:#FBF7F0;border-style:dashed;border-color:#D9C7A8;color:var(--muted)}
.orb.chaos .nd i{background:#C9B79A}
.nd.hot{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft),0 8px 20px -10px rgba(192,132,52,.7)}
.nd.hot i{background:var(--amber)}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;z-index:12;
  background:var(--amber);box-shadow:0 0 0 4px rgba(192,132,52,.25);opacity:0;transition:opacity .4s;pointer-events:none}
.orb.live .dot{opacity:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;min-height:38px}
.bar span{font-size:14.5px;color:var(--ink);font-weight:500;line-height:1.45}
.bar .hint{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.bar>span{flex:1}
@media(max-width:520px){.nd{gap:5px;padding:3px 8px 3px 3px}[dir=rtl] .nd{padding:3px 3px 3px 8px}.nd i{width:21px;height:21px}.nd i svg{width:12px;height:12px}}
.stage .bar{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stage .bar span{font-size:14px;color:var(--muted);flex:1}


/* ---------- live demo ---------- */
.demo .wrap{display:grid;gap:clamp(28px,4vw,52px);align-items:center}
@media(min-width:940px){.demo .wrap{grid-template-columns:.95fr 1.05fr}}
.tabs{display:flex;flex-direction:column;gap:8px;margin-top:26px}
.tabs button{display:block;text-align:start;font:inherit;cursor:pointer;background:none;
  border:1px solid transparent;border-inline-start:3px solid var(--line);
  padding:13px 16px;border-radius:0 10px 10px 0;color:var(--muted);transition:.2s}
[dir="rtl"] .tabs button{border-radius:10px 0 0 10px}
.tabs button b{display:block;color:var(--ink);font-weight:500;font-size:16px;
  font-family:"Rubik","Tajawal",sans-serif}
.tabs button span{font-size:14.5px}
.tabs button[aria-selected="true"]{background:var(--surface);border-inline-start-color:var(--amber)}
.tabs button:hover{background:var(--surface)}
.solve{margin-top:22px;padding:15px 17px;background:var(--surface);
  border:1px solid var(--line);border-left:0;border-right:0;border-radius:0}
.solve b{color:var(--pine-ink);font-weight:500}

.phone{justify-self:center;width:min(330px,88vw);aspect-ratio:9/17.4;
  background:#132C28;border-radius:34px;padding:11px;
  box-shadow:0 40px 70px -48px rgba(18,67,58,.75)}
.screen{width:100%;height:100%;background:var(--bg);border-radius:25px;overflow:hidden;
  display:flex;flex-direction:column;font-size:11.5px;position:relative}
.scr-top{background:var(--pine-ink);color:#fff;padding:13px 14px 11px;display:flex;align-items:center;gap:9px;flex:none}
.scr-top .av{width:24px;height:24px;border-radius:7px;background:var(--amber);flex:none}
.scr-top b{font-size:12px;font-weight:500;display:block}
.scr-top i{font-style:normal;font-size:9.5px;color:#9CBBB2;display:block}
.pane{display:none;flex:1;padding:13px;overflow:hidden}
.pane.on{display:block}

/* pane A — calendar clash */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:9px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--surface);display:grid;place-items:center;
  font-style:normal;color:var(--muted);font-size:9px;border:1px solid var(--line)}
.cal i.ex{background:#E7EDF4;border-color:#CBD9E6;color:#5B7E9E}
.chip{position:absolute;background:var(--amber);color:#fff;font-size:9.5px;padding:4px 8px;
  border-radius:6px;box-shadow:0 6px 14px -8px rgba(0,0,0,.5);white-space:nowrap}
.warn{margin-top:11px;background:#FBEAE6;border:1px solid #F0C9BF;color:#9C4527;
  border-radius:8px;padding:8px 10px;font-size:10px;opacity:0}
.fixed{margin-top:8px;background:#E4EFE9;border:1px solid #BEDACB;color:#1F6B4C;
  border-radius:8px;padding:8px 10px;font-size:10px;opacity:0}
.run .chip{animation:chipMove 9s ease-in-out infinite}
.run .warn{animation:fadeStep 9s ease-in-out infinite}
.run .fixed{animation:fadeStep2 9s ease-in-out infinite}
@keyframes chipMove{
  0%,8%   {transform:translate(0,-26px) scale(.9);opacity:0}
  16%,42% {transform:translate(0,0) scale(1);opacity:1}
  52%,100%{transform:translate(-34%,42px) scale(1);opacity:1}
}
@keyframes fadeStep{0%,18%{opacity:0}26%,46%{opacity:1}54%,100%{opacity:0}}
@keyframes fadeStep2{0%,54%{opacity:0}62%,94%{opacity:1}100%{opacity:0}}

/* pane B — case moving through departments */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 10px 3px;
  padding:9px 11px;font-size:10.5px;color:var(--body);max-width:85%}
.card{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px;opacity:0}
.card b{font-size:11.5px;color:var(--ink);display:block}
.card small{color:var(--muted);font-size:9.5px}
.flow{display:flex;gap:5px;margin-top:9px}
.flow span{flex:1;text-align:center;font-size:8.5px;padding:5px 2px;border-radius:5px;
  background:var(--veil);color:var(--muted)}
.run .card{animation:popIn 9s ease-in-out infinite}
.run .flow span:nth-child(1){animation:lit 9s ease-in-out infinite .0s}
.run .flow span:nth-child(2){animation:lit 9s ease-in-out infinite 1.6s}
.run .flow span:nth-child(3){animation:lit 9s ease-in-out infinite 3.2s}
.run .flow span:nth-child(4){animation:litEnd 9s ease-in-out infinite 4.8s}
@keyframes popIn{0%,10%{opacity:0;transform:translateY(8px)}20%,100%{opacity:1;transform:none}}
@keyframes lit{0%,22%{background:var(--veil);color:var(--muted)}
  30%,58%{background:var(--pine);color:#fff}66%,100%{background:#DCE8E3;color:var(--pine-ink)}}
@keyframes litEnd{0%,22%{background:var(--veil);color:var(--muted)}
  30%,100%{background:#1F6B4C;color:#fff}}

/* pane C — report builds itself */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.kpi b{display:block;font-family:"Rubik",sans-serif;font-size:18px;color:var(--pine-ink);line-height:1.1}
.kpi span{font-size:9px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:62px;margin-top:11px;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px}
.bars i{flex:1;background:var(--pine-2);border-radius:3px 3px 0 0;height:20%}
.ready{margin-top:9px;background:var(--pine-ink);color:#fff;border-radius:8px;
  padding:8px 10px;font-size:10px;opacity:0;display:flex;justify-content:space-between}
.run .bars i:nth-child(1){animation:grow 9s ease-in-out infinite .1s}
.run .bars i:nth-child(2){animation:grow 9s ease-in-out infinite .25s}
.run .bars i:nth-child(3){animation:grow 9s ease-in-out infinite .4s}
.run .bars i:nth-child(4){animation:grow 9s ease-in-out infinite .55s}
.run .bars i:nth-child(5){animation:grow 9s ease-in-out infinite .7s}
.run .ready{animation:fadeStep2 9s ease-in-out infinite}
.run .kpi b{animation:softIn 9s ease-in-out infinite}
@keyframes grow{0%,6%{height:8%}34%,100%{height:var(--h,60%)}}
@keyframes softIn{0%,8%{opacity:.15}22%,100%{opacity:1}}


/* pane D — discipline + behaviour handbook */
.inc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  display:flex;gap:9px;align-items:flex-start;opacity:0}
.inc .lv{flex:none;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:#fff;font-family:"Rubik",sans-serif;font-size:12px;position:relative}
.inc .lv span{position:absolute;inset:0;display:grid;place-items:center;border-radius:7px;opacity:0}
.inc .lv .l1{background:#2E6B5E}.inc .lv .l2{background:#C9A227}.inc .lv .l3{background:#C0603A}
.inc b{font-size:11px;color:var(--ink);display:block}
.inc small{font-size:9.5px;color:var(--muted)}
.rule{margin-top:9px;background:#F4F1E7;border:1px solid #E3DBC4;border-radius:9px;
  padding:9px 10px;font-size:10px;color:#6F5A21;opacity:0}
.acts{display:grid;gap:5px;margin-top:9px}
.acts div{background:var(--surface);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;font-size:9.5px;color:var(--muted);display:flex;justify-content:space-between;opacity:0}
.acts div i{font-style:normal;color:#1F6B4C;font-weight:700}
.run .inc{animation:popIn 11s ease-in-out infinite}
.run .inc .lv .l1{animation:lvFade 11s ease-in-out infinite}
.run .inc .lv .l2{animation:lvFade 11s ease-in-out infinite 1.7s}
.run .inc .lv .l3{animation:lvHold 11s ease-in-out infinite 3.4s}
.run .rule{animation:popIn 11s ease-in-out infinite 1.1s}
.run .acts div:nth-child(1){animation:tick 11s ease-in-out infinite 3.9s}
.run .acts div:nth-child(2){animation:tick 11s ease-in-out infinite 4.9s}
.run .acts div:nth-child(3){animation:tick 11s ease-in-out infinite 5.9s}
@keyframes lvFade{0%,4%{opacity:0}8%,14%{opacity:1}18%,100%{opacity:0}}
@keyframes lvHold{0%,2%{opacity:0}6%,100%{opacity:1}}
@keyframes tick{0%,2%{opacity:0;transform:translateX(6px)}10%,100%{opacity:1;transform:none}}

/* pane E — task follow-up */
.prog{height:6px;border-radius:4px;background:var(--veil);overflow:hidden;margin:9px 0 11px}
.prog i{display:block;height:100%;background:var(--pine-2);width:12%;border-radius:4px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;
  margin-bottom:6px;display:flex;align-items:center;gap:8px;font-size:10px}
.task .who{flex:none;width:20px;height:20px;border-radius:50%;background:var(--veil);
  display:grid;place-items:center;font-size:8.5px;color:var(--pine-ink)}
.task .tx{flex:1;color:var(--ink)}
.task .tx small{display:block;color:var(--muted);font-size:8.5px}
.task .st{position:relative;width:44px;height:17px;flex:none}
.task .st span{position:absolute;inset:0;border-radius:5px;display:grid;place-items:center;font-size:8.5px}
.task .st .late{background:#FBEAE6;color:#9C4527}
.task .st .done{background:#E4EFE9;color:#1F6B4C;opacity:0}
.task.fresh{opacity:0}
.run .prog i{animation:fill 11s ease-in-out infinite}
.run .task:nth-child(2) .st .done{animation:swap 11s ease-in-out infinite 2.2s}
.run .task:nth-child(2) .st .late{animation:swapOut 11s ease-in-out infinite 2.2s}
.run .task:nth-child(4) .st .done{animation:swap 11s ease-in-out infinite 4.4s}
.run .task:nth-child(4) .st .late{animation:swapOut 11s ease-in-out infinite 4.4s}
.run .task.fresh{animation:slideIn 11s ease-in-out infinite 6.4s}
@keyframes fill{0%,8%{width:12%}40%{width:46%}70%,100%{width:78%}}
@keyframes swap{0%,4%{opacity:0}12%,100%{opacity:1}}
@keyframes swapOut{0%,4%{opacity:1}12%,100%{opacity:0}}
@keyframes slideIn{0%,2%{opacity:0;transform:translateY(-10px)}10%,100%{opacity:1;transform:none}}

/* ---------- chaos strip ---------- */
.chaos{background:var(--surface);border-block:1px solid var(--line)}
.chaos ul{list-style:none;display:grid;gap:0;margin-top:26px}
@media(min-width:760px){.chaos ul{grid-template-columns:repeat(2,1fr);column-gap:44px}}
.chaos li{display:flex;gap:14px;padding:17px 0;border-bottom:1px solid var(--line)}
.chaos li i{flex:none;width:9px;height:9px;border-radius:2px;background:var(--amber);margin-top:11px;transform:rotate(12deg)}
.chaos li b{display:block;color:var(--ink);font-weight:500;font-family:"Rubik","Tajawal",sans-serif}
.chaos li p{font-size:15px;color:var(--muted);margin-top:2px}

/* ---------- systems ---------- */
.sys{display:grid;gap:0;margin-top:34px;border-top:1px solid var(--line)}
@media(min-width:820px){.sys{grid-template-columns:1fr 1fr;column-gap:48px}}
.sys article{padding:24px 0;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:flex-start}
.sys .ic{flex:none;width:42px;height:42px;border-radius:11px;background:var(--amber-soft);
  display:grid;place-items:center;color:var(--pine-ink)}
.sys .ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sys p{font-size:15.5px}
.sys .tag{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--pine);
  background:#E4EDE9;padding:3px 9px;border-radius:999px}

/* ---------- steps ---------- */
.steps{counter-reset:s;display:grid;gap:22px;margin-top:34px}
@media(min-width:780px){.steps{grid-template-columns:repeat(3,1fr);gap:30px}}
.steps li{list-style:none;counter-increment:s;position:relative;padding-top:46px}
.steps li::before{content:counter(s);position:absolute;top:0;inset-inline-start:0;
  width:34px;height:34px;border-radius:50%;background:var(--pine);color:#fff;
  display:grid;place-items:center;font-family:"Rubik",sans-serif;font-size:15px;font-weight:500}
.steps p{font-size:15.5px;color:var(--muted)}

/* ---------- trust ---------- */
.trust{background:var(--pine-ink);color:#CFE0DA}
.trust h2{color:#fff}
.trust .grid{display:grid;gap:26px;margin-top:32px}
@media(min-width:800px){.trust .grid{grid-template-columns:repeat(4,1fr)}}
.trust h3{color:#fff;font-size:16.5px;margin-bottom:5px}
.trust p{font-size:14.5px;color:#A9C4BC;max-width:34ch}
.trust .rule{width:26px;height:2px;background:var(--amber);margin-bottom:14px}


/* ---------- who / faq ---------- */
.who-box{display:grid;gap:26px;align-items:start}
@media(min-width:880px){.who-box{grid-template-columns:.85fr 1.15fr}}
.who-box .yrs{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:26px 24px;text-align:center}
.who-box .yrs b{display:block;font-family:"Rubik",sans-serif;font-size:56px;line-height:1;
  color:var(--pine-ink);font-weight:600}
.who-box .yrs span{display:block;margin-top:8px;font-size:15px;color:var(--muted)}
.who-box .yrs hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.who-box .yrs em{font-style:normal;font-size:14px;color:var(--body)}
.who-box p+p{margin-top:14px}

.faq{margin-top:30px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:18px 0;display:flex;gap:14px;align-items:flex-start;
  color:var(--ink);font-family:"Rubik","Tajawal",sans-serif;font-weight:500;font-size:17px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-inline-start:auto;color:var(--amber);font-size:22px;
  line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 0 20px;font-size:15.5px;color:var(--body);max-width:70ch}

/* ---------- pricing ---------- */
.plans{display:grid;gap:18px;margin-top:34px}
@media(min-width:860px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:26px 22px;display:flex;flex-direction:column}
.plan.mid{border-color:var(--pine);box-shadow:0 24px 46px -40px rgba(18,67,58,.6)}
.plan .price{font-family:"Rubik","Tajawal",sans-serif;font-size:19px;color:var(--pine-ink);font-weight:600;letter-spacing:.04em;margin:12px 0 4px}
.plan .price span{color:var(--line)}
.plan .per{font-size:13.5px;color:var(--muted)}
.plan ul{list-style:none;margin:18px 0 22px;display:grid;gap:9px}
.plan li{font-size:15px;display:flex;gap:9px;align-items:flex-start}
.plan li svg{width:17px;height:17px;flex:none;margin-top:4px;stroke:var(--pine-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.plan .btn{margin-top:auto}
.note{margin-top:18px;font-size:14.5px;color:var(--muted)}

/* ---------- contact ---------- */
.contact .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:clamp(28px,4vw,44px);display:grid;gap:26px;align-items:center}
@media(min-width:840px){.contact .box{grid-template-columns:1.1fr .9fr}}
.ways{display:grid;gap:11px}
.way{display:flex;align-items:center;gap:13px;padding:14px 16px;border:1px solid var(--line);
  border-radius:12px;text-decoration:none;background:var(--bg)}
.way:hover{border-color:var(--pine-2)}
.way svg{width:22px;height:22px;flex:none}
.way b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.way span{font-size:14px;color:var(--muted);direction:ltr;unicode-bidi:embed}

footer{border-top:1px solid var(--line);padding-block:28px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.soc{display:inline-flex;gap:10px}
.soc a{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--pine);transition:.2s}
.soc a:hover{background:var(--pine);color:#fff;border-color:var(--pine);transform:translateY(-2px)}
.soc svg{width:18px;height:18px;fill:currentColor}

footer .wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

/* ===== final pass: contrast that is easy on the eye over the film ===== */
.trust{background:rgba(10,32,27,.72);color:#DCEBE6;border-block:1px solid rgba(255,255,255,.10)}
.trust h2,.trust h3{color:#FFFFFF}
.trust p{color:#B9D2CB}
.trust .rule{background:rgba(240,192,126,.75)}
.chaos{background:rgba(9,24,20,.55)}
.chaos li b{color:#EAF4F0}
.chaos li p,.hero small,.try-note{color:#A9C2BB}
h1,h2,h3{color:#F2F8F6}
body{color:#C9DCD5}
.muted,.sys article p,.plan li,.faq p,details p{color:#A9C2BB}
.sys article{background:rgba(255,255,255,.05);border-radius:14px;padding-inline:16px;border:1px solid rgba(255,255,255,.09)}
.sys{border-top:0;gap:12px}
.sys article+article{border-top:0}
.plan{background:rgba(255,255,255,.06)}
.plan .price{color:#F3D7AE}
.lvl,.tag{background:rgba(192,132,52,.18);color:#F0C07E}
details{background:rgba(255,255,255,.05);border-radius:12px;padding-inline:14px}
summary{color:#EAF4F0}
footer{background:rgba(7,18,15,.72);color:#A9C2BB}
.top{background:rgba(7,18,15,.75)}
/* the film reads better a touch darker and softer */
.backdrop::after{background:linear-gradient(180deg,rgba(7,18,15,.78),rgba(7,18,15,.84) 40%,rgba(7,18,15,.90));backdrop-filter:blur(3px)}

/* hero: the real system on a phone */
.tourph{justify-self:center;margin:0;width:min(290px,70vw);position:relative}
.tourph .tsc{position:relative;aspect-ratio:400/716;border-radius:34px;overflow:hidden;background:#0B1F1A;
  border:9px solid #0A1411;outline:1px solid rgba(255,255,255,.14);
  box-shadow:0 50px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.4),0 0 80px -20px rgba(143,212,191,.25)}
.tourph .tsc img,.tourph .tsc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tourph .tsc video{opacity:0;transition:opacity .6s}
.tourph .tsc video.on{opacity:1}
.tourph figcaption{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--muted)}
.tourph figcaption i{width:8px;height:8px;border-radius:50%;background:#E0A458;box-shadow:0 0 0 0 rgba(224,164,88,.6);animation:tping 2s infinite}
@keyframes tping{70%{box-shadow:0 0 0 9px rgba(224,164,88,0)}100%{box-shadow:0 0 0 0 rgba(224,164,88,0)}}
@media(min-width:940px){.tourph{width:300px}}
@media(prefers-reduced-motion:reduce){.tourph figcaption i{animation:none}}

.chap{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}
.chap button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;position:relative;overflow:hidden;
  padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);transition:background .3s,border-color .3s}
.chap b{position:relative;z-index:1;font-weight:500;font-size:14px;color:var(--muted);transition:color .3s}
.chap s{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:rgba(143,212,191,.14);text-decoration:none}
.chap button[aria-current="true"]{border-color:rgba(224,164,88,.55);background:rgba(224,164,88,.08)}
.chap button[aria-current="true"] b{color:#fff}
.chap button:hover b,.chap button:focus-visible b{color:#fff}
@media(max-width:939px){
  .chap{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-4px}
  .chap::-webkit-scrollbar{display:none}
  .chap b{font-size:13px;white-space:nowrap}
}
@media(min-width:940px){.tourph{display:grid;grid-template-columns:300px 1fr;column-gap:22px;width:auto;align-items:center}
  .tourph figcaption{grid-column:1;grid-row:2}.tourph .chap{grid-column:2;grid-row:1;margin:0}}
</style>

wh_p1:["لدينا خبرة عشر سنوات في تنسيق الأنشطة المدرسية — التخطيط السنوي، الفعاليات والرحلات، التنسيق بين الأقسام، والتعامل اليومي مع أولياء الأمور.",
       "We bring ten years of coordinating school activities — annual planning, events and trips, coordination between departments, and daily contact with parents.",
       "Okul etkinlik koordinasyonunda on yıllık deneyimimiz var: yıllık planlama, etkinlik ve geziler, birimler arası koordinasyon ve velilerle günlük temas."],
wh_p2:["هذه الأنظمة لم تُصمَّم في مكتب برمجة ثم تُعرض على المدارس. بُنيت داخل المدرسة، لحل مشكلات كنا نقع فيها بأنفسنا كل أسبوع، واستُخدمت قبل أن تُباع.",
       "These systems were not designed in a software office and then offered to schools. They were built inside a school, to solve problems we ran into ourselves every week, and were used before they were sold.",
       "Bu sistemler bir yazılım ofisinde tasarlanıp okullara sunulmadı. Bir okulun içinde, her hafta kendi karşılaştığımız sorunları çözmek için kuruldu ve satılmadan önce kullanıldı."],
wh_p3:["لذلك ستجد في كل شاشة تفصيلة لا يعرفها إلا من عاش يوم عمل في مدرسة: لماذا يجب ألا يقع النشاط في أسبوع تقييم، ولماذا لا بد أن يُعرف من سجّل كل ملاحظة، ولماذا الحذف لا يمحو شيئًا.",
       "That is why every screen carries a detail only someone who has worked a school day would know: why an activity must not fall on an assessment week, why the source of every note has to be visible, and why deleting erases nothing.",
       "Bu yüzden her ekranda yalnızca okulda bir iş günü geçirenin bileceği bir ayrıntı vardır: etkinliğin neden değerlendirme haftasına denk gelmemesi gerektiği, her notun kaynağının neden görünmesi gerektiği ve silmenin neden hiçbir şeyi yok etmediği."],

fq_h:["أسئلة تُسأل قبل القرار","Questions asked before deciding","Karardan önce sorulan sorular"],
q1:["إذا أوقفنا الاشتراك، ماذا يحدث لبياناتنا؟","If we stop the subscription, what happens to our data?","Aboneliği durdurursak verilerimize ne olur?"],
a1:["تُسلَّم لكم كاملة بصيغة Excel وJSON خلال أيام، ثم تُحذف من الخوادم عند طلبكم. البيانات مدرسية وليست ملكًا لنا، ولا نحتجزها لإجباركم على التجديد.",
    "You receive all of it in Excel and JSON within days, then it is deleted from the servers at your request. The data belongs to the school, not to us, and we do not hold it back to force a renewal.",
    "Tamamı birkaç gün içinde Excel ve JSON olarak size teslim edilir, talebiniz üzerine sunuculardan silinir. Veriler okula aittir; yenilemeye zorlamak için tutulmaz."],
q2:["موظفونا ليسوا على دراية بالتكنولوجيا. هل سيستخدمونه فعلًا؟","Our staff are not technical. Will they actually use it?","Personelimiz teknoloji bilmiyor. Gerçekten kullanır mı?"],
a2:["الشاشة الواحدة تحتاج دقيقتين للشرح: زر واحد للإضافة، وقائمة للبحث. لا تنصيب على الأجهزة، ولا برنامج يُفتح — رابط وكلمة مرور. ومن يرفض التعلم عادةً يرفض لأن النظام معقّد، لا لأنه غير قادر.",
    "One screen takes two minutes to explain: one button to add, one list to search. Nothing to install and no program to open — a link and a password. People who refuse to learn usually refuse because the system is complicated, not because they cannot.",
    "Tek ekranı anlatmak iki dakika sürer: eklemek için bir düğme, aramak için bir liste. Kurulum yok, açılacak program yok — bir bağlantı ve bir şifre. Öğrenmeyi reddedenler genelde yapamadıkları için değil, sistem karmaşık olduğu için reddeder."],
q3:["هل نحتاج إنترنت طوال الوقت؟","Do we need internet all the time?","Sürekli internet gerekiyor mu?"],
a3:["نعم، لأن البيانات مركزية ويراها الجميع لحظيًا — وهذا هو سبب وجود النظام أصلًا. الاتصال المطلوب عادي تمامًا، ويعمل على بيانات الهاتف. وإن كانت شبكة مدرستكم ضعيفة، قولوا لنا قبل البدء.",
    "Yes, because the data is central and everyone sees it live — which is the point of the system. The connection needed is ordinary and works on mobile data. If your school network is weak, tell us before we start.",
    "Evet, çünkü veriler merkezîdir ve herkes anlık görür — sistemin amacı da budur. Gereken bağlantı sıradandır, mobil veriyle de çalışır. Okul ağınız zayıfsa başlamadan önce söyleyin."],
q4:["نحتاج تعديلات خاصة بمدرستنا. هل هذا ممكن؟","We need changes specific to our school. Is that possible?","Okulumuza özel değişiklikler gerekiyor. Mümkün mü?"],
a4:["الأسماء والصفوف والتصنيفات ومستويات اللائحة تُضبط لكم عند التجهيز، وهذه ليست تعديلات برمجية. أما إضافة شاشة أو نظام جديد فله وقت وتكلفة نتفق عليهما مسبقًا — ولن نقول نعم لكل طلب في المكالمة الأولى.",
    "Names, grades, categories and policy levels are configured for you at setup, and none of that is custom development. Adding a new screen or system has a timeline and a cost agreed in advance — and we will not say yes to every request on the first call.",
    "Adlar, sınıflar, kategoriler ve yönetmelik düzeyleri kurulumda size göre ayarlanır; bunlar yazılım geliştirme değildir. Yeni bir ekran veya sistem eklemek ise önceden anlaşılan bir süre ve maliyet gerektirir — ilk görüşmede her isteğe evet demeyiz."],
q5:["عندنا ملفات Excel من سنوات. هل نبدأ من الصفر؟","We have years of Excel files. Do we start from zero?","Yıllara yayılan Excel dosyalarımız var. Sıfırdan mı başlıyoruz?"],
a5:["لا. تُنقل ملفاتكم الحالية إلى النظام عند التجهيز، ويبقى التصدير إلى Excel متاحًا في أي وقت. الملف القديم يظل يعمل بجانب النظام حتى تطمئنوا، ثم تتركونه وحدكم.",
    "No. Your existing files are moved across at setup, and export back to Excel stays available at any time. The old file keeps working alongside the system until you are comfortable, then you drop it yourselves.",
    "Hayır. Mevcut dosyalarınız kurulumda aktarılır; Excel'e dışa aktarma her zaman açıktır. Eski dosya, siz rahat edene kadar sistemin yanında çalışmaya devam eder; sonra kendiniz bırakırsınız."],

hsub:["الأنشطة في ملف، الانضباط في دفتر، ملاحظات أولياء الأمور في واتساب، والمهام في اجتماع. Manage Smarter يجمعها في منصة واحدة يفتحها كل موظف من تليفونه، وكل قسم يرى ما يخصه فقط.",
      "Activities in a spreadsheet, discipline in a notebook, parent feedback in WhatsApp, tasks in a meeting. Manage Smarter brings them into one platform every staff member opens from their phone — each department seeing only what concerns them.",
      "Etkinlikler bir dosyada, disiplin bir defterde, veli geri bildirimleri WhatsApp'ta, görevler toplantıda. Manage Smarter bunları tek bir platformda toplar; her personel telefonundan açar, her birim yalnızca kendi alanını görür."],

st_h:["يوسف، حصة، وملاحظة اتكتبت في دفتر.","Yusuf, a lesson, and a note written in a notebook.","Yusuf, bir ders ve deftere yazılan bir not."],
st_s:["ده مش عرض مميزات. ده يوم عادي في مدرسة عادية، وفين بالظبط بتضيع المعلومة.","This isn't a feature list. It's an ordinary day in an ordinary school — and exactly where the information gets lost.","Bu bir özellik listesi değil. Sıradan bir okulda sıradan bir gün ve bilginin tam olarak nerede kaybolduğu."],
f1_t:["٧:٤٥ صباحًا","7:45 in the morning","Sabah 7:45"],
f1_p:["يوسف يدخل من بوابة المدرسة. يوم عادي، ومعاه ألف تفصيلة بتبدأ مع الجرس.","Yusuf walks through the school gate. An ordinary day — and a thousand details that start with the bell.","Yusuf okul kapısından girer. Sıradan bir gün ve zille başlayan bin ayrıntı."],
f2_t:["في الحصة","In the lesson","Derste"],
f2_p:["ذهنه مشغول بموقف حصل إمبارح. المعلم لاحظ، وكتب ملاحظة… في دفتره هو.","His mind is on something that happened yesterday. The teacher notices, and writes a note — in his own notebook.","Aklı dün olanlarda. Öğretmen fark eder ve bir not alır — kendi defterine."],
f3_t:["آخر اليوم","End of the day","Günün sonunda"],
f3_p:["الملاحظة في دفتر، والحضور في ملف، وكلام ولي الأمر في محادثة. محدش شايف الصورة كاملة.","The note is in a notebook, the list is in a file, the parent's message is in a chat. Nobody sees the whole picture.","Not defterde, liste dosyada, velinin mesajı sohbette. Kimse bütün resmi görmüyor."],
f4_t:["الحل مش نظام جديد لكل مشكلة","The answer isn't a new system for every problem","Cevap, her soruna yeni bir sistem değil"],
f4_p:["كل أداة جديدة بتضيف مكان جديد تدوّر فيه. المدرسة محتاجة مكان واحد، مش عشرة.","Every new tool adds one more place to search. A school needs one place, not ten.","Her yeni araç, aranacak bir yer daha ekler. Okulun on yere değil tek bir yere ihtiyacı var."],
f5_t:["مفتاح واحد لمدرسة كاملة","One key for the whole school","Tüm okul için tek anahtar"],
f5_p:["التقويم، الانضباط والإرشاد، المهام، وملاحظات أولياء الأمور — كلها جوه Manage Smarter، وكل قسم يفتح اللي يخصه بس.","Calendar, discipline and guidance, tasks and parent notes — all inside Manage Smarter, and each department opens only its own part.","Takvim, disiplin, görevler ve veli notları — hepsi Manage Smarter içinde; her bölüm yalnız kendi kısmını açar."],
f6_t:["وبعدها، اليوم بيعدي أهدى","And then the day runs quieter","Ve gün daha sakin geçer"],
f6_p:["الملاحظة وصلت للمسؤول عنها، والمتابعة اتقفلت، وكل حاجة اتسجلت في مكانها.","The note reached the person responsible, the follow-up was closed, and everything was recorded where it belongs.","Not sorumlusuna ulaştı, takip kapandı ve her şey ait olduğu yere kaydedildi."],

ch_h:["الفوضى لا تظهر في يوم واحد","Disorder never arrives in one day","Dağınıklık bir günde oluşmaz"],
ch_sub:["تتراكم ملفًا بعد ملف، حتى تصبح الإدارة عملًا كاملًا بجانب العمل.",
        "It builds up one file at a time, until administration becomes a full job beside the job.",
        "Dosya dosya birikir; sonunda yönetim, işin yanında ayrı bir işe dönüşür."],
ch1b:["نسخ Excel لا يعرف أحد أيها الأحدث","Excel copies and nobody knows which is current","Hangisinin güncel olduğu bilinmeyen Excel kopyaları"],
ch1p:["كل موظف عنده نسخة، والدمج يدوي في آخر الأسبوع.",
      "Everyone keeps a copy, and merging happens by hand at the end of the week.",
      "Herkeste bir kopya var; birleştirme hafta sonu elle yapılıyor."],
ch2b:["معلومة عن ولي أمر تضيع في محادثة","A parent's concern lost inside a chat","Bir sohbette kaybolan veli konusu"],
ch2p:["قِيلت لمشرف، ولم تصل للقسم المسؤول، ولم يتابعها أحد.",
      "Told to one supervisor, never reaching the department that could act on it.",
      "Bir müdür yardımcısına söylendi, ilgili birime hiç ulaşmadı."],
ch3b:["نشاط يصطدم بأسبوع امتحانات","An activity landing on an exam week","Sınav haftasına denk gelen etkinlik"],
ch3p:["لأن التقويم موجود في ثلاثة أماكن مختلفة.",
      "Because the calendar lives in three different places.",
      "Çünkü takvim üç ayrı yerde duruyor."],
ch4b:["تقرير نهاية الفصل يُجمع في ليلة","A term report assembled overnight","Bir gecede toplanan dönem raporu"],
ch4p:["بدل أن يُبنى من بيانات تُسجَّل أول بأول.",
      "Instead of building itself from data logged as it happens.",
      "Anında kaydedilen verilerden kendiliğinden oluşması gerekirken."],

sy_h:["أنظمة تعمل معًا، لا أدوات متفرقة","Systems that work together, not separate tools","Ayrı araçlar değil, birlikte çalışan sistemler"],
sy_sub:["ابدأ بنظام واحد وأضف الباقي وقتما تحتاج. الحساب واحد لكل الأنظمة، والصلاحيات تُحدَّد لكل موظف على حدة.",
        "Start with one system and add the rest when you need them. One account covers all of them, with permissions set per staff member.",
        "Tek bir sistemle başlayın, gerektiğinde diğerlerini ekleyin. Tek hesap hepsini kapsar; yetkiler personel bazında belirlenir."],
s1h:["التقويم والأنشطة","Calendar & activities","Takvim ve etkinlikler"],
s1p:["خطة السنة كاملة: الأنشطة والرحلات والاجتماعات والامتحانات، مع تنبيه فوري عند أي تعارض في المواعيد.",
     "The full year in one plan — activities, trips, meetings and exams — flagging any clash the moment it appears.",
     "Tüm yıl tek planda: etkinlikler, geziler, toplantılar ve sınavlar; çakışmalar anında işaretlenir."],
s1t:["يمكن نشره لأولياء الأمور برابط عام","Publishable to parents via a public link","Velilere herkese açık bağlantıyla yayınlanabilir"],
s2h:["الانضباط والإرشاد","Discipline & guidance","Disiplin ve rehberlik"],
s2p:["تسجيل الحالات ومتابعتها حتى الإغلاق، وسجل متصل لكل طالب بدل أوراق متفرقة.",
     "Log incidents and follow them to closure, with one connected record per student instead of loose paperwork.",

/* hero: scattered school data -> one organized system.
   Plain DOM + one small SVG. The animation loop runs only while the scene is visible. */
window.ORB=(()=>{
  if(!document.getElementById("orb")) return null;
  const el=$("#orb"), svg=el.querySelector(".orb-lines"), dot=el.querySelector(".dot"),
        cap=$("#orbCap"), btn=$("#asmBtn");
  const RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const IC={
    st:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/>',
    te:'<circle cx="9" cy="7" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><path d="M15 4h6v7h-4"/>',
    of:'<path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/>',
    dp:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    dc:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    at:'<path d="M4 6l2 2 3-3M4 13l2 2 3-3M4 20h.01"/><path d="M12 7h8M12 14h8M12 20h8"/>',
    ca:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    ds:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>'
  };
  const K=["st","te","of","dp","dc","at","ca","ds"];
  // hand-placed "mess": x,y as share of the stage, rotation in degrees
  const MESS=[[.16,.18,-14],[.78,.14,11],[.30,.80,9],[.84,.66,-12],[.52,.30,17],[.12,.56,-8],[.64,.86,-17],[.46,.62,6]];
  const FLOWS=[["st","dc","of"],["te","at","dp"],["of","ca","ds"]];
  const N=K.map((k,i)=>{
    const n=document.createElement("div");n.className="nd";n.dataset.k=k;
    n.innerHTML=`<i><svg viewBox="0 0 24 24">${IC[k]}</svg></i><span></span>`;
    el.appendChild(n);
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");svg.appendChild(ln);
    return {k,n,ln,i,p:0,x:0,y:0,base:i/K.length*Math.PI*2};
  });
  let W=0,H=0,org=false,t0=performance.now(),spin=0,vel=.00016,tilt=.36,tiltT=.36,
      flow=0,flowAt=0,hold=0,run=false,seen=false,drag=null,story=null,storyT=0;

  const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
  function size(){W=el.clientWidth;H=el.clientHeight;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);}
  function pos(o,now){
    const mw=o.n.offsetWidth,mh=o.n.offsetHeight;
    const m=MESS[o.i], wob=Math.sin(now/900+o.i*1.7);
    const cx=m[0]*W+wob*4, cy=m[1]*H+Math.cos(now/1100+o.i)*4, cr=m[2]+wob*2;
    const a=o.base+spin, R=Math.min(W*.4,H*.7);
    const rx=W/2+Math.cos(a)*R, ry=H/2+Math.sin(a)*R*(tilt*1.25+.12);
    const d=(Math.sin(a)+1)/2, sc=.84+.2*d;
    const e=ease(o.p);
    o.x=cx+(rx-cx)*e; o.y=cy+(ry-cy)*e;
    o.x=Math.max(mw/2+4,Math.min(W-mw/2-4,o.x)); o.y=Math.max(mh/2+4,Math.min(H-mh/2-4,o.y));
    const r=cr*(1-e), s=1+(sc-1)*e;
    o.n.style.transform=`translate(${o.x-mw/2}px,${o.y-mh/2}px) rotate(${r}deg) scale(${s})`;
    o.n.style.zIndex=org&&e>.5?(d>.5?8:4):3;
    o.n.style.opacity=(1-e)*.92+e*(.62+.38*d);
    o.ln.setAttribute("x1",W/2);o.ln.setAttribute("y1",H/2);
    o.ln.setAttribute("x2",o.x);o.ln.setAttribute("y2",o.y);
  }
  function setFlow(f){
    flow=f;const F=FLOWS[f];
    N.forEach(o=>{const on=org&&F.includes(o.k);o.n.classList.toggle("hot",on);o.ln.classList.toggle("on",on);});
    paint();
  }
  // dot travels: first -> core -> second -> core -> third
  function dotAt(now){
    const F=FLOWS[flow].map(k=>N.find(o=>o.k===k)), C={x:W/2,y:H/2};
    const path=[F[0],C,F[1],C,F[2]], u=((now-flowAt)/2600)%1*4, seg=Math.floor(u), f=u-seg;
    const A=path[seg],B=path[seg+1];
    dot.style.transform=`translate(${A.x+(B.x-A.x)*f}px,${A.y+(B.y-A.y)*f}px)`;
  }
  function frame(now){
    if(!run) return;
    const dt=Math.min(now-(frame.last||now),50);frame.last=now;
    if(!drag) spin+=vel*dt*(hold>now?.25:1);
    vel+=(.00016-vel)*.02;
    tilt+=(tiltT-tilt)*.08;
    N.forEach(o=>{const target=org?1:0, k=org?Math.max(0,(now-t0)/1300-o.i*.06):(now-t0)/900;
      o.p=org?Math.min(1,Math.max(o.p,k)):Math.max(0,Math.min(o.p,1-k));pos(o,now);});
    if(org&&now>flowAt+7800&&hold<now){flowAt=now;setFlow((flow+1)%FLOWS.length);}
    if(org&&N[N.length-1].p>=1) {el.classList.add("live");dotAt(now);} else el.classList.remove("live");
    requestAnimationFrame(frame);
  }
  function start(){if(run||RM) return;run=true;frame.last=0;requestAnimationFrame(frame);}
  function stop(){run=false;}
  function set(o){
    org=o;t0=performance.now();flowAt=t0;el.classList.toggle("chaos",!org);
    if(RM){N.forEach(x=>{x.p=org?1:0;pos(x,0);});}
    setFlow(0);start();
  }
  function paint(){
    N.forEach(o=>o.n.querySelector("span").textContent=D.orb_n[o.k][LI]);
    cap.textContent=story?D.orb_s[story][LI]:(org?D.orb_f[flow][LI]:D.asm_state[LI]);
    btn.textContent=org?D.asm_btn2[LI]:D.asm_btn[LI];
    if(RM) N.forEach(o=>pos(o,0));
  }
  btn.onclick=()=>set(!org);
  N.forEach(o=>o.n.addEventListener("click",e=>{
    e.stopPropagation(); if(!org){set(true);return;}
    const f=FLOWS.findIndex(F=>F[0]===o.k)>=0?FLOWS.findIndex(F=>F[0]===o.k):FLOWS.findIndex(F=>F.includes(o.k));
    hold=performance.now()+9000;flowAt=performance.now();setFlow(f);
    story=o.k;cap.textContent=D.orb_s[o.k][LI];
    clearTimeout(storyT);storyT=setTimeout(()=>{story=null;paint();},7000);
  }));
  // pointer: tilt the orbit with the mouse, spin it with a drag or swipe
  el.addEventListener("pointermove",e=>{
    const r=el.getBoundingClientRect();
    if(e.pointerType==="mouse") tiltT=.22+.3*((e.clientY-r.top)/r.height);
    if(drag){const dx=e.clientX-drag.x;drag.x=e.clientX;spin+=dx/r.width*2.4;vel=dx/r.width*.02;}
  });
  el.addEventListener("pointerdown",e=>{if(org&&!e.target.closest(".nd")) drag={x:e.clientX};});
  addEventListener("pointerup",()=>drag=null);
  el.addEventListener("pointerleave",()=>{tiltT=.36;});
  new ResizeObserver(()=>{size();if(!run) N.forEach(o=>pos(o,performance.now()));}).observe(el);
  new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){start(); if(!seen){seen=true; setTimeout(()=>{if(!org) set(true);},RM?0:1100);}}
    else stop();
  }),{threshold:.2}).observe(el);
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());
  size(); N.forEach(o=>pos(o,0));
  return {paint};
})();
if(window.ORB) ORB.paint();

/* 3D layer: reveal-from-depth on scroll, scroll-driven campus, pointer tilt on scene cards */
(()=>{
  const RM=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // reveal: also lift the existing sections' key blocks
  $$(".chaos li,.sys article,#how li,.trust .wrap>*,#pricing .wrap>*,#faq details,#contact .wrap>*,section>.wrap>h2").forEach(e=>e.classList.add("rv"));
  const rv=$$(".rv");
  if(RM||!("IntersectionObserver" in window)){rv.forEach(e=>e.classList.add("on"));}
  else{
    const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){
      const sib=[...x.target.parentElement.children].filter(c=>c.classList.contains("rv"));
      x.target.style.transitionDelay=Math.min(sib.indexOf(x.target),5)*90+"ms";
      x.target.classList.add("on");io.unobserve(x.target);}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
    rv.forEach(e=>io.observe(e));
  }
  if(RM) return;
  // campus: tilted miniature that flattens and turns toward you as you scroll
  const c=$("#campus"); if(!c) return; let px=0,py=0,tick=false;
  function upd(){
    tick=false;const r=c.getBoundingClientRect(),vh=innerHeight;
    const p=Math.max(0,Math.min(1,(vh-r.top)/(vh+r.height*.4)));
    const e=1-Math.pow(1-p,2);
    c.style.setProperty("--rx",(16-15*e+py*5).toFixed(2)+"deg");
    c.style.setProperty("--ry",(px*8).toFixed(2)+"deg");
    c.style.setProperty("--rz",(-5+5*e).toFixed(2)+"deg");
    c.style.setProperty("--sc",(.84+.16*e).toFixed(3));
  }
  const req=()=>{if(!tick){tick=true;requestAnimationFrame(upd);}};
  addEventListener("scroll",req,{passive:true});addEventListener("resize",req);
  c.parentElement.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();
    px=(e.clientX-r.left)/r.width-.5;py=(e.clientY-r.top)/r.height-.5;req();});
  c.parentElement.addEventListener("pointerleave",()=>{px=py=0;req();});
  upd();
  // scene cards: tilt toward the pointer (mouse and finger)
  $$(".scn").forEach(card=>{
    const inn=card.querySelector(".in");
    const mv=e=>{const r=card.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      inn.style.setProperty("--ty",(x*14).toFixed(1)+"deg");inn.style.setProperty("--tx",(-y*14).toFixed(1)+"deg");};
    card.addEventListener("pointermove",mv);card.addEventListener("pointerdown",mv);
    const rs=()=>{inn.style.setProperty("--ty","0deg");inn.style.setProperty("--tx","0deg");};
    card.addEventListener("pointerleave",rs);card.addEventListener("pointerup",rs);card.addEventListener("pointercancel",rs);
  });
})();

<script>
/* the film runs behind the whole page: six shots in order, then it starts again */
(()=>{
  const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const save=navigator.connection&&navigator.connection.saveData;
  const box=document.querySelector(".backdrop");
  const band=document.querySelector(".film");
  const N=6; let i=0, cur=null, next=null;
  const mk=n=>{const v=document.createElement("video");v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");
    v.preload="auto";v.setAttribute("aria-hidden","true");const wb=v.canPlayType('video/webm; codecs="vp9"');
    v.src="/assets/film/shot"+n+(wb?".webm":".mp4");return v;};
  if(!RM && !save && box){
    const step=()=>{
      const v=next||mk(i+1); next=null;
      box.appendChild(v); v.play().catch(()=>{});
      v.classList.add("on");
      if(cur){const old=cur;old.classList.remove("on");setTimeout(()=>old.remove(),1500);}
      cur=v; i=(i+1)%N;
      next=mk(i+1);                                  /* warm the next shot while this one plays */
      v.onended=step;
      box.querySelector("img.bp").src="/assets/film/shot"+(i+1)+".webp";
    };
    addEventListener('load',()=>setTimeout(step, innerWidth>820?400:1400),{once:true});
    document.addEventListener("visibilitychange",()=>{if(!cur)return;document.hidden?cur.pause():cur.play().catch(()=>{});});
  }
  /* the one titled moment keeps its own clip of the key */
  if(band && !RM && !save){
    const v=document.createElement("video");v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute("playsinline","");
    v.preload="none";const wb=v.canPlayType('video/webm; codecs="vp9"');
    v.src="/assets/film/shot5"+(wb?".webm":".mp4");
    band.insertBefore(v,band.querySelector(".over"));
    new IntersectionObserver(es=>es.forEach(x=>{
      if(x.isIntersecting){v.play().catch(()=>{});v.classList.add("on");}else{v.pause();v.classList.remove("on");}
    }),{threshold:.25}).observe(band);
  }
  document.querySelectorAll(".btn").forEach(b=>b.addEventListener("pointermove",e=>{
    const r=b.getBoundingClientRect();b.style.setProperty("--bx",(e.clientX-r.left)+"px");
    b.style.setProperty("--by2",(e.clientY-r.top)+"px");}));
})();
</script>

<script>
/* hero phone: plays the real app tour only while it is on screen */
(()=>{const v=document.getElementById("tourv");if(!v)return;
  const RM=matchMedia("(prefers-reduced-motion: reduce)").matches, save=navigator.connection&&navigator.connection.saveData;
  if(RM||save)return;
  let ready=false;
  new IntersectionObserver(es=>es.forEach(x=>{
    if(x.isIntersecting){
      if(!ready){ready=true;v.src="/assets/film/app-tour"+(v.canPlayType('video/webm; codecs="vp9"')?".webm":".mp4");
        v.addEventListener("playing",()=>v.classList.add("on"),{once:true});}
      v.play().catch(()=>{});
    }else v.pause();
  }),{threshold:.3}).observe(v);
  const bs=[...document.querySelectorAll("#chap button")], ts=bs.map(b=>+b.dataset.t);
  let cur=-1;
  const sync=()=>{const t=v.currentTime,d=v.duration||14.13;let k=0;ts.forEach((x,n)=>{if(t>=x)k=n;});
    const end=ts[k+1]??d, f=Math.min(1,(t-ts[k])/(end-ts[k]));
    if(k!==cur){bs.forEach((b,n)=>{b.setAttribute("aria-current",n===k);if(n!==k)b.querySelector("s").style.width="0";});cur=k;
      if(innerWidth<940){const b=bs[k],c=b.closest(".chap");c.scrollTo({left:b.offsetLeft-(c.clientWidth-b.offsetWidth)/2,behavior:"smooth"});}}
    bs[k].querySelector("s").style.width=(f*100)+"%";
    if(!v.paused)requestAnimationFrame(sync);};
  v.addEventListener("play",()=>requestAnimationFrame(sync));
  bs.forEach((b,n)=>b.addEventListener("click",()=>{if(!ready){ready=true;v.src="/assets/film/app-tour"+(v.canPlayType('video/webm; codecs="vp9"')?".webm":".mp4");}
    const go=()=>{v.currentTime=ts[n]+.02;v.play().catch(()=>{});v.classList.add("on");};
    v.readyState>0?go():v.addEventListener("loadedmetadata",go,{once:true});}));
})();
</script>
