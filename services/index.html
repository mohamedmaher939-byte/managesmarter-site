<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خدماتنا الإضافية وشركاؤنا — Manage Smarter</title>
<meta name="description" content="Additional services and partners of Manage Smarter — including Dalelak services for Arabs in Türkiye.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EC;--surface:#fff;--veil:#E3E8E2;--ink:#16302B;--body:#4B5F58;--muted:#78908A;--pine:#2E6B5E;--pine-2:#3E8C7A;--amber:#C08434;--amber-soft:#F3E6D2;--line:#D7DED8;--rad:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);font-family:"Tajawal","Rubik",system-ui,sans-serif;font-size:16.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,.mark,nav a{font-family:"Rubik","Tajawal",system-ui,sans-serif}
h1,h2,h3{color:var(--ink);font-weight:600;line-height:1.25}
h1{font-size:clamp(28px,4.6vw,44px)}
h2{font-size:clamp(21px,2.8vw,28px);margin-bottom:16px}
h3{font-size:19px;margin-bottom:6px}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--amber);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.top{position:sticky;top:0;z-index:5;background:rgba(237,240,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.mark{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);font-size:17px;text-decoration:none}
.mark svg{width:28px;height:28px;flex:none}
nav{margin-inline-start:auto;display:flex;align-items:center;gap:6px}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.langs button{border:none;background:none;font:inherit;font-size:13px;font-weight:500;padding:6px 11px;cursor:pointer;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--pine);color:#fff}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:500;border-radius:10px;padding:10px 18px;font-size:15px;border:1px solid transparent}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn.solid{background:var(--pine);color:#fff}
.btn.solid:hover{background:var(--pine-2)}
.hero{padding-block:clamp(44px,7vw,80px) 28px}
.hero p{max-width:60ch;font-size:18px;margin-top:12px}
.kicker{display:inline-block;font-size:13px;font-weight:500;color:var(--amber);background:var(--amber-soft);padding:3px 11px;border-radius:999px;margin-bottom:14px}
section{padding-block:26px 40px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:24px;display:flex;flex-direction:column;gap:10px}
.card.feature{border-color:var(--pine);box-shadow:0 1px 0 var(--line)}
.logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--pine);color:#fff;font:600 20px "Rubik","Tajawal",sans-serif}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-block:4px 8px}
.tags span{font-size:13px;background:var(--veil);color:var(--ink);padding:2px 10px;border-radius:999px}
.card .btn{align-self:flex-start;margin-top:auto}
.card.empty{border-style:dashed;background:transparent;align-items:flex-start}
.card.empty .logo{background:var(--veil);color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
footer{border-top:1px solid var(--line);padding-block:26px;font-size:14px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media(max-width:480px){.mark span{display:none}.btn.sm{padding:6px 10px;font-size:13px}.langs button{padding:6px 9px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="/" aria-label="Manage Smarter">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="2" y="2" width="13" height="13" rx="3" fill="#2E6B5E"/>
        <rect x="17" y="2" width="13" height="13" rx="3" fill="#3E8C7A"/>
        <rect x="2" y="17" width="13" height="13" rx="3" fill="#3E8C7A"/>
        <rect x="17.8" y="17.8" width="13" height="13" rx="3" fill="#C08434" transform="rotate(-9 24.3 24.3)"/>
      </svg>
      <span>Manage Smarter</span>
    </a>
    <nav>
      <div class="langs" role="group" aria-label="Language">
        <button data-l="ar" aria-pressed="true">ع</button>
        <button data-l="tr" aria-pressed="false">TR</button>
        <button data-l="en" aria-pressed="false">EN</button>
      </div>
      <a class="btn sm ghost" href="https://app.managesmarter.app" data-i="login"></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap hero">
    <span class="kicker" data-i="kicker"></span>
    <h1 data-i="h1"></h1>
    <p data-i="lede"></p>
  </div>

  <section>
    <div class="wrap">
      <h2 data-i="svc_h"></h2>
      <div class="grid">
        <article class="card feature">
          <div class="logo" aria-hidden="true">د</div>
          <h3 data-i="dal_t"></h3>
          <p data-i="dal_p"></p>
          <div class="tags">
            <span data-i="t1"></span><span data-i="t2"></span><span data-i="t3"></span><span data-i="t4"></span>
          </div>
          <a class="btn solid" href="/dalelak/" data-i="dal_btn"></a>
        </article>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2 data-i="par_h"></h2>
      <div class="grid">
        <article class="card empty">
          <div class="logo" aria-hidden="true">+</div>
          <h3 data-i="par_t"></h3>
          <p class="muted" data-i="par_p"></p>
        </article>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> Manage Smarter</span>
    <a href="/" data-i="back"></a>
  </div>
</footer>

<script>
const L=["ar","en","tr"];let LI=0;
const D={
login:["دخول","Sign in","Giriş"],
kicker:["خارج المنصة المدرسية","Beyond the school platform","Okul platformunun ötesinde"],
h1:["خدماتنا الإضافية وشركاؤنا","More services & partners","Ek hizmetler ve ortaklarımız"],
lede:["إلى جانب أنظمة إدارة المدارس، نقدّم خدمات عملية ونتعاون مع شركاء موثوقين.",
      "Alongside our school management systems, we offer practical services and work with trusted partners.",
      "Okul yönetim sistemlerimizin yanında pratik hizmetler sunuyor ve güvenilir ortaklarla çalışıyoruz."],
svc_h:["خدماتنا","Our services","Hizmetlerimiz"],
dal_t:["دليلك — طريقك في تركيا","Dalelak — your way in Türkiye","Dalelak — Türkiye'deki rehberiniz"],
dal_p:["خدمات للعرب في تركيا: ترجمة، واستشارات عقارية، ومتابعة الملفات والمعاملات.",
       "Services for Arabs in Türkiye: translation, real estate advice, and help with files and paperwork.",
       "Türkiye'deki Araplar için hizmetler: tercüme, gayrimenkul danışmanlığı ve evrak işlemleri."],
t1:["ترجمة","Translation","Tercüme"],
t2:["استشارات عقارية","Real estate advice","Gayrimenkul danışmanlığı"],
t3:["الإقامة والمعاملات","Residence & paperwork","İkamet ve evrak"],
t4:["تحضير YKS","YKS prep","YKS hazırlık"],
dal_btn:["افتح دليلك ←","Open Dalelak →","Dalelak'ı aç →"],
par_h:["شركاؤنا","Our partners","Ortaklarımız"],
par_t:["قريبًا","Coming soon","Yakında"],
par_p:["نضيف هنا شركاءنا قريبًا. للتعاون تواصل معنا.",
       "Our partners will be listed here soon. Get in touch to work with us.",
       "Ortaklarımız yakında burada yer alacak. İş birliği için bize ulaşın."],
back:["→ العودة إلى الصفحة الرئيسية","← Back to home","← Ana sayfaya dön"]
};
const $$=q=>document.querySelectorAll(q);
function paint(){
  const l=L[LI];document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$("[data-i]").forEach(e=>{const v=D[e.dataset.i];if(v)e.textContent=v[LI];});
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  document.title=D.h1[LI]+" — Manage Smarter";
}
$$(".langs button").forEach(b=>b.onclick=()=>{LI=L.indexOf(b.dataset.l);paint();});
document.getElementById("yr").textContent=new Date().getFullYear();
paint();
</script>
</body>
</html>
